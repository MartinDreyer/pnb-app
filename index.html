<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <!-- Disable page zoom; we implement pinch-zoom inside the canvas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mal efter tal</title>
  <style>
    :root {
      --target-w: 1620;
      --target-h: 2160;
      --topbar-h: 64px;
      /* Floating palette height */
      --palette-h: clamp(220px, 22vh, 360px);
      --bg: #FFFFFF;
      --panel: #FFFFFF;
      --panel2: #FFFFFF;
      --text: #111111;
      --muted: #444444;
      --accent: #6ea8ff;
      --stroke: rgba(0,0,0,0.12);
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      overscroll-behavior: none;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    .topbar {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 4px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--stroke);
      background: #FFFFFF;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      /* Height is intentionally NOT fixed: translated hint text varies in
         length, and forcing a single line (or a hardcoded height) either
         truncates it or clips a wrapped second line depending on language.
         --topbar-h is measured from the real rendered height (see
         wireTopbarHeightSync) and used by .canvas/.fitWarning to offset
         around whatever that turns out to be. min-height is just the
         pre-JS-measurement fallback. */
      min-height: var(--topbar-h);
      box-sizing: border-box;
      z-index: 50;
    }

    .title {
      font-weight: 650;
      letter-spacing: 0.2px;
      font-size: 14px;
      opacity: 0.95;
      user-select: none;
    }

    .logo {
      height: 14px; /* match .title font-size */
      width: auto;
      display: block;
    }

    select {
      background: #FFFFFF;
      color: var(--text);
      border: 1px solid var(--stroke);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
      outline: none;
    }

    /* Sits on its own full-width row under the logo, so the whole line is
       always visible instead of competing for space with other elements.
       Wraps rather than truncating — translated text length is unpredictable. */
    .hint {
      font-size: 12px;
      line-height: 1.35;
      color: var(--muted);
      user-select: none;
      white-space: normal;
    }

    .canvas {
      background: var(--panel2);
      position: absolute;
      inset: 0;
      padding-top: var(--topbar-h);
      /* Reserve space so the painting still fits in visible area */
      padding-bottom: calc(var(--palette-h) + env(safe-area-inset-bottom, 0px));
      box-sizing: border-box;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .svgWrap {
      width: 100%;
      height: 100%;
      /* Grid items default to min-width/min-height:auto, which for a replaced element
         with an intrinsic aspect ratio (our SVG/img below) can demand more height than
         is actually available. Combined with .canvas's overflow:hidden, that silently
         crops the bottom instead of letting preserveAspectRatio/object-fit do their job.
         min-height/min-width:0 forces this box to actually respect its constrained size. */
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 12px;
      box-sizing: border-box;
    }

    /* Injected SVG */
    #pnb-svg {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      background: white;
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      /* We handle pan/zoom ourselves */
      touch-action: none;
      transform-origin: 0 0;
    }

    /* Final revealed PNG */
    .finalImage {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      object-fit: contain;
      background: white;
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      display: block;
      opacity: 0;
      transition: opacity 2250ms ease;
    }

    .finalImage.show {
      opacity: 1;
    }

    #pnb-svg path {
      cursor: pointer;
      transition: fill 60ms linear;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    #pnb-svg path[data-color-num="-1"] {
      cursor: not-allowed;
    }

    @keyframes pnbWrongTap {
      0% { opacity: 1; }
      45% { opacity: 0.32; }
      100% { opacity: 1; }
    }

    #pnb-svg path.pnb-wrong {
      animation: pnbWrongTap 170ms ease;
    }

    @keyframes pnbHintPulse {
      0%, 100% { stroke: rgba(255, 90, 90, 0.95); stroke-width: 3; }
      50% { stroke: rgba(255, 90, 90, 0.15); stroke-width: 6; }
    }

    #pnb-svg path.pnb-hint {
      animation: pnbHintPulse 700ms ease-in-out 3;
      paint-order: stroke;
    }

    .palette {
      border-top: 1px solid var(--stroke);
      background: #FFFFFF;
      padding: 10px 10px calc(16px + env(safe-area-inset-bottom, 0px));
      box-sizing: border-box;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--palette-h);
      z-index: 60;
    }

    .paletteHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .selected {
      font-size: 13px;
      color: var(--muted);
      user-select: none;
    }

    .swatchesWrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      height: 100%;
    }

    .swatches {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 84px;
      gap: 10px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      /* Top/right padding gives the .swatchCheck badge (which pokes outside
         its .swatch's own box) room so this container's overflow-y: hidden
         doesn't clip it. */
      padding: 10px 10px 6px 0;
      height: 100%;
      box-sizing: border-box;
    }

    /* Edge fades signal there are more colors to scroll to — without them,
       the row can look like a short, complete list on narrow screens. */
    .edgeFade {
      position: absolute;
      top: 0;
      bottom: 6px;
      width: 34px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 200ms ease;
      display: flex;
      align-items: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--muted);
      z-index: 5;
    }

    .edgeFade.show {
      opacity: 1;
    }

    .edgeFade.left {
      left: 0;
      justify-content: flex-start;
      background: linear-gradient(to right, #FFFFFF 45%, rgba(255,255,255,0));
    }

    .edgeFade.right {
      right: 0;
      justify-content: flex-end;
      background: linear-gradient(to left, #FFFFFF 45%, rgba(255,255,255,0));
    }

    .swatch {
      height: 84px;
      border-radius: 14px;
      border: 2px solid rgba(0,0,0,0.12);
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      user-select: none;
      touch-action: manipulation;
    }

    .swatchInner {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.20);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
    }

    .swatchNum {
      font-weight: 750;
      font-size: 13px;
      color: rgba(0,0,0,0.88);
      text-shadow: none;
    }

    .swatchCount {
      font-weight: 650;
      font-size: 12px;
      color: rgba(0,0,0,0.70);
      text-shadow: none;
      opacity: 0.95;
      line-height: 1;
    }

    .swatchCount.empty {
      opacity: 0.35;
    }

    .swatch.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(110,168,255,0.20);
    }

    .swatch:active {
      transform: translateY(1px);
    }

    /* Completed colors move to the end of the row and dim, rather than
       disappearing — they stay visible as a record of progress. */
    .swatch.done {
      order: 50;
      opacity: 0.5;
    }

    .swatchCheck {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #2a9d8f;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 200ms ease, transform 200ms ease;
    }

    .swatch.done .swatchCheck {
      opacity: 1;
      transform: scale(1);
    }

    .loading {
      color: var(--muted);
      font-size: 13px;
      padding: 18px;
      user-select: none;
    }

    .fitWarning {
      position: fixed;
      top: calc(var(--topbar-h) + 8px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 70;
      background: #fff3cd;
      color: #664d03;
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      max-width: calc(100vw - 24px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      display: none;
    }

    .fitWarning.show {
      display: block;
    }

    /* Zoom affordance: one-time animated hint + persistent controls */
    .zoomHint {
      position: fixed;
      left: 50%;
      top: calc(var(--topbar-h) + 40%);
      transform: translate(-50%, -50%);
      z-index: 65;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 400ms ease;
    }

    .zoomHint.show {
      opacity: 1;
    }

    .zoomHintIcon {
      font-size: 40px;
      animation: pnbPinch 1400ms ease-in-out infinite;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.35));
    }

    @keyframes pnbPinch {
      0%, 100% { transform: scale(0.85); }
      50% { transform: scale(1.15); }
    }

    .zoomHintText {
      background: rgba(0,0,0,0.72);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .zoomControls {
      position: fixed;
      right: 12px;
      bottom: calc(var(--palette-h) + env(safe-area-inset-bottom, 0px) + 14px);
      z-index: 55;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .zoomBtn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.92);
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: manipulation;
      cursor: pointer;
    }

    .zoomBtn:active {
      transform: translateY(1px);
    }

    /* Hint button */
    .hintBtn {
      font-size: 13px;
      font-weight: 650;
      color: var(--text);
      background: #FFFFFF;
      border: 1px solid var(--stroke);
      border-radius: 999px;
      padding: 6px 12px;
      user-select: none;
      touch-action: manipulation;
      cursor: pointer;
    }

    .hintBtn:active {
      transform: translateY(1px);
    }

    .hintBtn[disabled] {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Completion trivia panel */
    .triviaPanel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #FFFFFF;
      border-top: 1px solid var(--stroke);
      box-shadow: 0 -8px 28px rgba(0,0,0,0.18);
      padding: 14px 18px calc(16px + env(safe-area-inset-bottom, 0px));
      box-sizing: border-box;
      max-height: 42vh;
      overflow-y: auto;
      z-index: 60;
      transform: translateY(100%);
      transition: transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .triviaPanel.show {
      transform: translateY(0);
    }

    .triviaClose {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 18px;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 8px;
      user-select: none;
    }

    .triviaTitle {
      font-weight: 750;
      font-size: 15px;
      margin: 0 28px 2px 0;
    }

    .triviaArtist {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .triviaGrid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 12px;
      font-size: 13px;
      margin: 0 0 10px 0;
    }

    .triviaGrid dt {
      color: var(--muted);
      font-weight: 600;
    }

    .triviaGrid dd {
      margin: 0;
    }

    .triviaFact {
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
    }

    .triviaLoading {
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="fitWarning" id="fitWarning" data-i18n="fitWarning"></div>
    <div class="topbar">
      <img class="logo" src="logo.png" alt="" data-i18n-alt="logoAlt" />
      <!-- Deliberately doesn't show the painting's title/artist — that's
           part of the game: guess what you're painting as you go. The real
           title is revealed in the trivia panel on completion instead. -->
      <div class="hint" data-i18n="topbarHint"></div>
    </div>

    <div class="canvas">
      <div class="svgWrap" id="svgWrap">
        <div class="loading" id="loading" data-i18n="loading"></div>
      </div>
    </div>

    <div class="zoomHint" id="zoomHint">
      <div class="zoomHintIcon">🤏</div>
      <div class="zoomHintText" data-i18n="zoomHintText"></div>
    </div>

    <div class="zoomControls" id="zoomControls">
      <div class="zoomBtn" id="zoomInBtn" role="button" tabindex="0" data-i18n-aria="zoomInLabel">+</div>
      <div class="zoomBtn" id="zoomOutBtn" role="button" tabindex="0" data-i18n-aria="zoomOutLabel">–</div>
      <div class="zoomBtn" id="zoomResetBtn" role="button" tabindex="0" data-i18n-aria="zoomResetLabel">⤢</div>
    </div>

    <div class="palette">
      <div class="paletteHeader">
        <div class="selected" id="selectedLabel" data-i18n="selectedNone"></div>
        <div class="hintBtn" id="hintBtn" role="button" tabindex="0" data-i18n-aria="hintButtonLabel"></div>
      </div>
      <div class="swatchesWrap">
        <div class="swatches" id="swatches"></div>
        <div class="edgeFade left" id="swatchFadeLeft" aria-hidden="true">‹</div>
        <div class="edgeFade right" id="swatchFadeRight" aria-hidden="true">›</div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // SUPABASE_URL / SUPABASE_ANON_KEY come from config.js (checked in for local dev,
    // swap per environment).
    const SUPABASE_URL = window.PNB_CONFIG.SUPABASE_URL;
    const SUPABASE_ANON_KEY = window.PNB_CONFIG.SUPABASE_ANON_KEY;

    // UI language. Defaults to Danish; set window.PNB_CONFIG.LANG in config.js
    // to switch (falls back to Danish if that language's file is missing).
    // Translation strings live in i18n/<lang>.json, not hardcoded here, so
    // adding a language later is just adding a new JSON file.
    const LANG = (window.PNB_CONFIG && window.PNB_CONFIG.LANG) || 'da';
    const FALLBACK_LANG = 'da';
    let I18N = {};

    async function loadTranslations(lang) {
      try {
        const res = await fetch(`i18n/${lang}.json`, { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (err) {
        if (lang !== FALLBACK_LANG) {
          console.warn(`Falling back to "${FALLBACK_LANG}" translations (couldn't load "${lang}"):`, err);
          return loadTranslations(FALLBACK_LANG);
        }
        console.error('Failed to load translations; falling back to raw keys.', err);
        return {};
      }
    }

    // Simple {{placeholder}} substitution — no plural rules, no nesting.
    // Falls back to the raw key so a missing translation is visible/obvious
    // rather than silently blank.
    function t(key, vars) {
      let str = I18N[key] || key;
      if (vars) {
        for (const k of Object.keys(vars)) str = str.split(`{{${k}}}`).join(String(vars[k]));
      }
      return str;
    }

    function applyStaticTranslations() {
      document.title = t('appTitle');
      for (const el of document.querySelectorAll('[data-i18n]')) {
        el.textContent = t(el.dataset.i18n);
      }
      for (const el of document.querySelectorAll('[data-i18n-aria]')) {
        el.setAttribute('aria-label', t(el.dataset.i18nAria));
      }
      for (const el of document.querySelectorAll('[data-i18n-alt]')) {
        el.setAttribute('alt', t(el.dataset.i18nAlt));
      }
    }

    // Keeps --topbar-h in sync with the topbar's real rendered height, which
    // varies with translated text length (one line in English, maybe two in
    // a longer language) and viewport width. .canvas/.fitWarning read this
    // var to offset around the topbar, so a hardcoded height would either
    // truncate text or let it overlap the canvas depending on language.
    function wireTopbarHeightSync() {
      const topbar = document.querySelector('.topbar');
      if (!topbar || typeof ResizeObserver === 'undefined') return;
      const sync = () => {
        document.documentElement.style.setProperty('--topbar-h', `${Math.ceil(topbar.getBoundingClientRect().height)}px`);
      };
      new ResizeObserver(sync).observe(topbar);
      sync();
    }

    function storagePublicUrl(path) {
      return `${SUPABASE_URL}/storage/v1/object/public/puzzles/${path}`;
    }

    // The "current puzzle" is whichever rotation_schedule row's active_from/active_until
    // window contains right now (see pnb-database's schema docs). RLS on the anon key
    // only ever exposes published puzzles.
    async function fetchActivePuzzle() {
      const nowIso = new Date().toISOString();
      const params = new URLSearchParams({
        select: 'id,active_from,active_until,puzzles(id,palette,svg_storage_path,reference_png_storage_path,paintings(title,artist,smk_object_number))',
        active_from: `lte.${nowIso}`,
        active_until: `gte.${nowIso}`,
        order: 'active_from.desc',
        limit: '1',
      });
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rotation_schedule?${params.toString()}`, {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        },
      });
      if (!res.ok) throw new Error(t('errorLoadPuzzleFailed', { status: res.status }));
      const rows = await res.json();
      if (!rows.length) throw new Error(t('errorNoActivePuzzle'));
      const row = rows[0];
      return {
        puzzleId: row.puzzles.id,
        palette: row.puzzles.palette, // [{num, rgb: [r,g,b]}, ...] — same shape the UI already expects
        svgUrl: storagePublicUrl(row.puzzles.svg_storage_path),
        referenceImageUrl: storagePublicUrl(row.puzzles.reference_png_storage_path),
        title: row.puzzles.paintings ? row.puzzles.paintings.title : '',
        artist: row.puzzles.paintings ? row.puzzles.paintings.artist : '',
        smkObjectNumber: row.puzzles.paintings ? row.puzzles.paintings.smk_object_number : '',
      };
    }

    function cssRgb(rgb) {
      return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
    }

    function rgbKey(rgb) {
      return `${rgb[0]},${rgb[1]},${rgb[2]}`;
    }

    function parseFillFromStyle(styleStr) {
      // expects: fill: rgb(r, g, b);
      const m = /fill\s*:\s*rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*;?/i.exec(styleStr || '');
      if (!m) return null;
      return [Number(m[1]), Number(m[2]), Number(m[3])];
    }

    async function loadSvg(url) {
      const res = await fetch(url, { cache: 'no-cache' });
      if (!res.ok) throw new Error(t('errorLoadSvgFailed', { status: res.status, url }));
      const txt = await res.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(txt, 'image/svg+xml');
      const svg = doc.documentElement;
      svg.setAttribute('id', 'pnb-svg');
      // Ensure the SVG can scale. We'll also refine the viewBox using getBBox()
      // after insertion into the DOM (see fitSvgToWrap()). This fallback helps
      // if getBBox isn't available for some reason.
      if (!svg.getAttribute('viewBox')) {
        const wAttr = svg.getAttribute('width');
        const hAttr = svg.getAttribute('height');
        const w = wAttr ? parseFloat(String(wAttr).replace(/[^\d.]/g, '')) : NaN;
        const h = hAttr ? parseFloat(String(hAttr).replace(/[^\d.]/g, '')) : NaN;
        if (Number.isFinite(w) && Number.isFinite(h)) svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      }

      svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      // Force the outer SVG element to size to its container.
      svg.setAttribute('width', '100%');
      svg.setAttribute('height', '100%');
      svg.style.width = '100%';
      svg.style.height = '100%';
      svg.style.display = 'block';
      return svg;
    }

    function fitSvgToWrap(svg) {
      // Make sure the drawing fits INSIDE .svgWrap (contain).
      // Some SVG exports have content that extends beyond the declared width/height.
      // Using getBBox() after insertion lets us compute the true bounds.
      try {
        const bbox = svg.getBBox();
        if (bbox && bbox.width > 0 && bbox.height > 0) {
          // getBBox() doesn't include stroke width; add a small padding so edges
          // don't get clipped and the overall drawing looks properly contained.
          const pad = Math.max(bbox.width, bbox.height) * 0.02; // 2% padding
          const x = bbox.x - pad;
          const y = bbox.y - pad;
          const w = bbox.width + pad * 2;
          const h = bbox.height + pad * 2;
          svg.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
          svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        }
      } catch (_e) {
        // ignore (getBBox can fail if SVG isn't fully ready)
      }
    }

    // Belt-and-suspenders check: confirm the rendered element is actually fully
    // contained within its wrapper (a couple of CSS px of rounding is fine). If it's
    // ever not — a future regression, an unusual device viewport, etc. — surface a
    // visible warning instead of silently letting the bottom get clipped off.
    function checkFitsWithinWrap(el, wrapEl) {
      const warningEl = document.getElementById('fitWarning');
      if (!warningEl) return;
      const elRect = el.getBoundingClientRect();
      const wrapRect = wrapEl.getBoundingClientRect();
      const tolerance = 1;
      const fits =
        elRect.width > 0 &&
        elRect.height > 0 &&
        elRect.top >= wrapRect.top - tolerance &&
        elRect.left >= wrapRect.left - tolerance &&
        elRect.bottom <= wrapRect.bottom + tolerance &&
        elRect.right <= wrapRect.right + tolerance;
      warningEl.classList.toggle('show', !fits);
      if (!fits) {
        console.warn('Puzzle does not fully fit its container', { elRect, wrapRect });
      }
    }

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 5;

    // Combines pan/zoom with tap-to-paint. Touch taps are detected directly
    // from touchstart/touchend (movement + duration thresholds) and painted
    // immediately, rather than waiting on a browser-synthesized 'click' —
    // which after our own pan/zoom transform is often delayed or dropped
    // entirely, making taps feel unresponsive on phones/tablets.
    function wireCanvasInteractions(svg, wrapEl, paletteSelection, onCorrectPaint) {
      // Pan/zoom state applies a CSS transform to the SVG element.
      const state = {
        scale: 1,
        tx: 0,
        ty: 0,
        mode: null, // 'pan' | 'pinch'
        startX: 0,
        startY: 0,
        startTx: 0,
        startTy: 0,
        startScale: 1,
        startDist: 0,
        pinchSvgX: 0,
        pinchSvgY: 0,
        tapStartX: 0,
        tapStartY: 0,
        tapStartTime: 0,
        tapMoved: false,
        suppressClickUntil: 0,
      };

      const TAP_MOVE_THRESHOLD = 14; // px
      const TAP_MAX_DURATION = 350; // ms

      function attemptPaint(path) {
        if (!path) return;
        const selectedNum = paletteSelection.getSelectedNum();
        const selectedRgb = paletteSelection.getSelectedRgb();
        if (selectedNum == null || selectedRgb == null) return;

        const needed = path.dataset.colorNum;
        if (needed !== selectedNum) {
          if (needed !== '-1') {
            path.classList.remove('pnb-wrong');
            // Force reflow so a rapid re-tap re-triggers the animation.
            void path.offsetWidth;
            path.classList.add('pnb-wrong');
          }
          return;
        }
        if (path.dataset.painted === '1') return;
        path.style.fill = selectedRgb;
        path.dataset.painted = '1';
        if (typeof onCorrectPaint === 'function') onCorrectPaint(path);
      }

      function apply() {
        svg.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
      }

      function clamp() {
        const w = wrapEl.clientWidth;
        const h = wrapEl.clientHeight;
        if (!w || !h) return;

        const scaledW = w * state.scale;
        const scaledH = h * state.scale;

        if (state.scale <= 1) {
          state.tx = (w - scaledW) / 2;
          state.ty = (h - scaledH) / 2;
        } else {
          const minTx = w - scaledW;
          const minTy = h - scaledH;
          if (state.tx > 0) state.tx = 0;
          if (state.ty > 0) state.ty = 0;
          if (state.tx < minTx) state.tx = minTx;
          if (state.ty < minTy) state.ty = minTy;
        }
      }

      function setScale(nextScale, centerX, centerY) {
        const s = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, nextScale));

        // Keep the point under (centerX, centerY) stable.
        const svgX = (centerX - state.tx) / state.scale;
        const svgY = (centerY - state.ty) / state.scale;
        state.scale = s;
        state.tx = centerX - svgX * state.scale;
        state.ty = centerY - svgY * state.scale;
        clamp();
        apply();
      }

      // Zoom in/out one step, centered on the wrap's visible middle — used by
      // the on-screen +/- buttons so zoom feels controlled and deliberate.
      function stepScale(factor) {
        const w = wrapEl.clientWidth;
        const h = wrapEl.clientHeight;
        setScale(state.scale * factor, w / 2, h / 2);
      }

      // Pan/zoom so the given point (in the SVG element's own untransformed
      // CSS-pixel box) is centered in the wrap, at the given scale. Used by
      // the hint feature to jump to an unpainted region.
      function focusOnLocalPoint(lx, ly, targetScale) {
        const w = wrapEl.clientWidth;
        const h = wrapEl.clientHeight;
        const s = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, targetScale));
        state.scale = s;
        state.tx = w / 2 - s * lx;
        state.ty = h / 2 - s * ly;
        clamp();
        apply();
      }

      // Reset to fit (scale=1, centered) after we have the final viewBox.
      function reset() {
        state.scale = 1;
        state.tx = 0;
        state.ty = 0;
        clamp();
        apply();
      }

      function dismissZoomHint() {
        const el = document.getElementById('zoomHint');
        if (el) el.classList.remove('show');
        try { localStorage.setItem('pnb_zoom_hint_seen', '1'); } catch (_e) { /* ignore */ }
      }

      // Touch events (best support on iPad Safari)
      function getCenter(t1, t2) {
        const rect = wrapEl.getBoundingClientRect();
        return {
          x: ((t1.clientX + t2.clientX) / 2) - rect.left,
          y: ((t1.clientY + t2.clientY) / 2) - rect.top,
        };
      }

      function dist(t1, t2) {
        const dx = t2.clientX - t1.clientX;
        const dy = t2.clientY - t1.clientY;
        return Math.hypot(dx, dy);
      }

      svg.addEventListener('touchstart', (e) => {
        dismissZoomHint();
        if (e.touches.length === 1) {
          state.mode = 'pan';
          const rect = wrapEl.getBoundingClientRect();
          state.startX = e.touches[0].clientX - rect.left;
          state.startY = e.touches[0].clientY - rect.top;
          state.startTx = state.tx;
          state.startTy = state.ty;

          // Tap tracking (independent of pan, which only kicks in once the
          // finger actually moves past the threshold below).
          state.tapStartX = e.touches[0].clientX;
          state.tapStartY = e.touches[0].clientY;
          state.tapStartTime = Date.now();
          state.tapMoved = false;
        } else if (e.touches.length === 2) {
          state.tapMoved = true; // a second finger means this isn't a tap
          state.mode = 'pinch';
          state.startScale = state.scale;
          state.startTx = state.tx;
          state.startTy = state.ty;
          state.startDist = dist(e.touches[0], e.touches[1]);
          const c = getCenter(e.touches[0], e.touches[1]);
          // Record the SVG-space point under the pinch center at start.
          state.pinchSvgX = (c.x - state.startTx) / state.startScale;
          state.pinchSvgY = (c.y - state.startTy) / state.startScale;
        }
      }, { passive: true });

      svg.addEventListener('touchmove', (e) => {
        // Prevent page scroll/zoom while interacting with the canvas.
        e.preventDefault();
        if (state.mode === 'pan' && e.touches.length === 1) {
          const rect = wrapEl.getBoundingClientRect();
          const x = e.touches[0].clientX - rect.left;
          const y = e.touches[0].clientY - rect.top;
          state.tx = state.startTx + (x - state.startX);
          state.ty = state.startTy + (y - state.startY);
          clamp();
          apply();
          // Judge "was this a tap or a drag" by how far the artwork actually
          // moved on screen (post-clamp), not raw finger movement. At the
          // default zoom level clamp() pins tx/ty in place, so ordinary
          // finger jitter during a tap never gets misread as a drag.
          const movedX = Math.abs(state.tx - state.startTx);
          const movedY = Math.abs(state.ty - state.startTy);
          if (movedX > TAP_MOVE_THRESHOLD || movedY > TAP_MOVE_THRESHOLD) state.tapMoved = true;
        } else if (state.mode === 'pinch' && e.touches.length === 2) {
          const d = dist(e.touches[0], e.touches[1]);
          if (!state.startDist) return;
          const nextScale = state.startScale * (d / state.startDist);
          const c = getCenter(e.touches[0], e.touches[1]);

          // Scale around pinch center (using the SVG-space point captured at start).
          const s = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, nextScale));
          state.scale = s;
          state.tx = c.x - state.pinchSvgX * state.scale;
          state.ty = c.y - state.pinchSvgY * state.scale;
          clamp();
          apply();
        }
      }, { passive: false });

      svg.addEventListener('touchend', (e) => {
        const wasPan = state.mode === 'pan';
        state.mode = null;
        if (!wasPan || state.tapMoved) return;
        if (Date.now() - state.tapStartTime > TAP_MAX_DURATION) return;
        // A clean, un-moved, quick single-finger touch: paint immediately
        // instead of waiting on a synthetic click event.
        const el = document.elementFromPoint(state.tapStartX, state.tapStartY);
        const path = el ? el.closest('path') : null;
        if (path) attemptPaint(path);
        state.suppressClickUntil = Date.now() + 600;
      }, { passive: true });
      svg.addEventListener('touchcancel', (_e) => {
        state.mode = null;
      }, { passive: true });

      // Mouse/keyboard/fallback path — ignored right after a touch tap already
      // handled the paint, so a delayed synthetic click doesn't double-fire.
      svg.addEventListener('click', (e) => {
        if (Date.now() < state.suppressClickUntil) return;
        const path = e.target.closest('path');
        if (path) attemptPaint(path);
      });

      // Mouse wheel zoom (desktop)
      svg.addEventListener('wheel', (e) => {
        e.preventDefault();
        dismissZoomHint();
        const rect = wrapEl.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const factor = Math.exp(-e.deltaY * 0.0015);
        setScale(state.scale * factor, x, y);
      }, { passive: false });

      // Mouse drag pan (desktop)
      let mouseDown = false;
      svg.addEventListener('mousedown', (e) => {
        dismissZoomHint();
        mouseDown = true;
        const rect = wrapEl.getBoundingClientRect();
        state.mode = 'pan';
        state.startX = e.clientX - rect.left;
        state.startY = e.clientY - rect.top;
        state.startTx = state.tx;
        state.startTy = state.ty;
      });
      window.addEventListener('mousemove', (e) => {
        if (!mouseDown || state.mode !== 'pan') return;
        const rect = wrapEl.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        state.tx = state.startTx + (x - state.startX);
        state.ty = state.startTy + (y - state.startY);
        clamp();
        apply();
      });
      window.addEventListener('mouseup', () => {
        mouseDown = false;
        state.mode = null;
      });

      window.addEventListener('resize', () => {
        clamp();
        apply();
      });

      reset();
      return { reset, setScale, stepScale, focusOnLocalPoint, getScale: () => state.scale };
    }

    function buildSwatches(palette) {
      const swatches = document.getElementById('swatches');
      swatches.innerHTML = '';
      const counterByNum = new Map();
      for (const c of palette) {
        const el = document.createElement('div');
        el.className = 'swatch';
        el.setAttribute('role', 'button');
        el.setAttribute('tabindex', '0');
        el.setAttribute('aria-label', t('colorAriaLabel', { num: c.num }));
        el.dataset.num = String(c.num);
        el.dataset.rgb = cssRgb(c.rgb);

        const inner = document.createElement('div');
        inner.className = 'swatchInner';
        inner.style.background = cssRgb(c.rgb);

        const num = document.createElement('div');
        num.className = 'swatchNum';
        num.textContent = String(c.num);

        const count = document.createElement('div');
        count.className = 'swatchCount empty';
        count.textContent = '';
        count.dataset.num = String(c.num);
        counterByNum.set(c.num, count);

        const check = document.createElement('div');
        check.className = 'swatchCheck';
        check.textContent = '✓';

        // Layout: number (top), color square (middle), counter (bottom)
        el.appendChild(num);
        el.appendChild(inner);
        el.appendChild(count);
        el.appendChild(check);
        swatches.appendChild(el);
      }

      // Add a cheat button at the end — always after any completed colors.
      const cheat = document.createElement('div');
      cheat.className = 'swatch cheat';
      cheat.style.order = '100';
      cheat.id = 'cheatBtn';
      cheat.setAttribute('role', 'button');
      cheat.setAttribute('tabindex', '0');
      cheat.setAttribute('aria-label', t('cheatAriaLabel'));

      const cheatTop = document.createElement('div');
      cheatTop.className = 'swatchNum';
      cheatTop.textContent = t('cheatTop');

      const cheatMid = document.createElement('div');
      cheatMid.className = 'swatchInner';
      cheatMid.style.background = '#FFFFFF';
      cheatMid.style.borderStyle = 'dashed';
      cheatMid.style.borderColor = 'rgba(0,0,0,0.25)';

      const cheatBottom = document.createElement('div');
      cheatBottom.className = 'swatchCount';
      cheatBottom.textContent = t('cheatBottom');

      cheat.appendChild(cheatTop);
      cheat.appendChild(cheatMid);
      cheat.appendChild(cheatBottom);
      swatches.appendChild(cheat);

      return counterByNum;
    }

    // The swatch row scrolls horizontally, but on a narrow phone only ~4
    // colors fit on screen at once — without a cue, it can look like the
    // whole palette rather than a scrollable strip. Edge fades signal
    // there's more in whichever direction still has content, and a one-time
    // nudge scroll (per browser) makes the scrollability unmistakable.
    function wireSwatchScrollHints(swatchesEl) {
      const leftFade = document.getElementById('swatchFadeLeft');
      const rightFade = document.getElementById('swatchFadeRight');
      if (!leftFade || !rightFade) return;

      function update() {
        const hasOverflow = swatchesEl.scrollWidth > swatchesEl.clientWidth + 1;
        leftFade.classList.toggle('show', hasOverflow && swatchesEl.scrollLeft > 4);
        rightFade.classList.toggle(
          'show',
          hasOverflow && swatchesEl.scrollLeft < swatchesEl.scrollWidth - swatchesEl.clientWidth - 4
        );
      }

      swatchesEl.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', update);
      update();

      let seen = false;
      try { seen = localStorage.getItem('pnb_swatch_hint_seen') === '1'; } catch (_e) { /* ignore */ }
      if (!seen && swatchesEl.scrollWidth > swatchesEl.clientWidth + 1) {
        setTimeout(() => {
          swatchesEl.scrollTo({ left: 46, behavior: 'smooth' });
          setTimeout(() => swatchesEl.scrollTo({ left: 0, behavior: 'smooth' }), 550);
        }, 500);
        try { localStorage.setItem('pnb_swatch_hint_seen', '1'); } catch (_e) { /* ignore */ }
      }
    }

    function setSwatchCount(counterByNum, colorNum, painted, total) {
      const el = counterByNum.get(colorNum);
      if (!el) return;
      if (!total || total <= 0) {
        el.textContent = '';
        el.classList.add('empty');
        return;
      }
      el.textContent = `${painted}/${total}`;
      el.classList.remove('empty');

      // When a color is fully completed, move its swatch to the end of the
      // row and mark it done instead of hiding it — keeps a visible record
      // of progress rather than making colors vanish.
      const swatch = el.closest('.swatch');
      if (swatch && swatch.id !== 'cheatBtn') {
        swatch.classList.toggle('done', painted >= total);
      }
    }

    function wirePaletteSelection() {
      let selectedNum = null;
      let selectedRgb = null;

      const selectedLabel = document.getElementById('selectedLabel');
      const swatches = document.getElementById('swatches');

      function setSelected(el) {
        for (const node of swatches.querySelectorAll('.swatch')) node.classList.remove('active');
        el.classList.add('active');
        selectedNum = el.dataset.num;
        selectedRgb = el.dataset.rgb;
        selectedLabel.textContent = t('selectedNum', { num: selectedNum });
      }

      swatches.addEventListener('click', (e) => {
        const el = e.target.closest('.swatch');
        if (!el) return;
        if (el.id === 'cheatBtn') return;
        setSelected(el);
      });

      swatches.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const el = e.target.closest('.swatch');
        if (!el) return;
        e.preventDefault();
        if (el.id === 'cheatBtn') return;
        setSelected(el);
      });

      return {
        getSelectedNum: () => selectedNum,
        getSelectedRgb: () => selectedRgb,
      };
    }

    function annotateSvg(svg, palette) {
      const rgbToNum = new Map(palette.map(c => [rgbKey(c.rgb), c.num]));

      const paths = svg.querySelectorAll('path');
      for (const p of paths) {
        // Determine the correct fill from its original style/fill.
        const styleStr = p.getAttribute('style') || '';
        let rgb = parseFillFromStyle(styleStr);
        if (!rgb) {
          const fillAttr = p.getAttribute('fill');
          const m = /^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i.exec(fillAttr || '');
          if (m) rgb = [Number(m[1]), Number(m[2]), Number(m[3])];
        }

        const num = rgb ? (rgbToNum.get(rgbKey(rgb)) ?? -1) : -1;
        p.dataset.colorNum = String(num);
        if (rgb) p.dataset.correctFill = cssRgb(rgb);
        p.dataset.painted = '0';

        // Hide until painted.
        p.style.fill = 'rgb(255,255,255)';
      }

      return svg;
    }

    const SMK_API_BASE_URL = 'https://api.smk.dk/api/v1';

    // Real lookup against SMK's own open API (the same source the generator backend
    // pulls paintings from), keyed by the painting's smk_object_number. SMK doesn't
    // expose an art-movement/style field or a ready-made "fun fact", so those are
    // assembled from the fields it does have (object type, technique/materials,
    // the artist's lifespan, acquisition year).
    async function fetchPaintingTrivia(objectNumber, title, artist) {
      if (!objectNumber) throw new Error('No smk_object_number for this painting');

      const params = new URLSearchParams({ object_number: objectNumber, lang: LANG === 'da' ? 'da' : 'en' });
      const res = await fetch(`${SMK_API_BASE_URL}/art?${params.toString()}`);
      if (!res.ok) throw new Error(`SMK API HTTP ${res.status}`);
      const data = await res.json();
      const item = data.items && data.items[0];
      if (!item) throw new Error(`No SMK data for ${objectNumber}`);

      const production = (item.production && item.production[0]) || {};
      const year = (item.production_date && item.production_date[0] && item.production_date[0].period) || '';
      const style = (item.object_names || []).map((o) => o.name).filter(Boolean).join(', ');
      const mediumSource = item.techniques && item.techniques.length ? item.techniques : item.materials || [];
      const medium = mediumSource.filter(Boolean).join(', ');

      let period = '';
      if (production.creator_date_of_birth && production.creator_date_of_death) {
        period = t('triviaLifespan', {
          birth: new Date(production.creator_date_of_birth).getFullYear(),
          death: new Date(production.creator_date_of_death).getFullYear(),
        });
      }

      const artistName = artist || t('triviaArtistFallback');
      const acquisitionYear = item.acquisition_date ? new Date(item.acquisition_date).getFullYear() : null;
      let funFact = '';
      if (medium && acquisitionYear) {
        funFact = t('triviaFunFactAcquired', { artist: artistName, medium, year: acquisitionYear });
      } else if (medium) {
        funFact = t('triviaFunFactMedium', { artist: artistName, medium });
      }

      return { year, period, style, medium, funFact };
    }

    function renderTriviaPanel(svgWrap, puzzle) {
      const panel = document.createElement('div');
      panel.className = 'triviaPanel';
      panel.id = 'triviaPanel';

      const close = document.createElement('div');
      close.className = 'triviaClose';
      close.textContent = '×';
      close.setAttribute('role', 'button');
      close.setAttribute('aria-label', t('triviaCloseLabel'));
      close.addEventListener('click', () => panel.classList.remove('show'));

      const title = document.createElement('div');
      title.className = 'triviaTitle';
      title.textContent = puzzle.title || t('triviaUntitled');

      const artist = document.createElement('div');
      artist.className = 'triviaArtist';
      artist.textContent = puzzle.artist || '';

      const loading = document.createElement('div');
      loading.className = 'triviaLoading';
      loading.textContent = t('triviaLoading');

      panel.appendChild(close);
      panel.appendChild(title);
      panel.appendChild(artist);
      panel.appendChild(loading);
      svgWrap.appendChild(panel);

      requestAnimationFrame(() => panel.classList.add('show'));

      fetchPaintingTrivia(puzzle.smkObjectNumber, puzzle.title, puzzle.artist).then((trivia) => {
        loading.remove();

        const grid = document.createElement('dl');
        grid.className = 'triviaGrid';
        const rows = [
          [t('triviaYear'), trivia.year],
          [t('triviaPeriod'), trivia.period],
          [t('triviaStyle'), trivia.style],
          [t('triviaMedium'), trivia.medium],
        ];
        for (const [label, value] of rows) {
          if (!value) continue;
          const dt = document.createElement('dt');
          dt.textContent = label;
          const dd = document.createElement('dd');
          dd.textContent = value;
          grid.appendChild(dt);
          grid.appendChild(dd);
        }
        panel.appendChild(grid);

        if (trivia.funFact) {
          const fact = document.createElement('div');
          fact.className = 'triviaFact';
          fact.textContent = trivia.funFact;
          panel.appendChild(fact);
        }
      }).catch((err) => {
        console.error(err);
        loading.textContent = t('triviaError');
      });
    }

    function revealOriginalInWrap(svgWrap, referenceImageUrl, puzzle) {
      const img = document.createElement('img');
      img.className = 'finalImage';
      img.alt = t('finalImageAlt');
      img.src = referenceImageUrl;

      svgWrap.innerHTML = '';
      svgWrap.appendChild(img);

      const show = () => {
        // Ensure we have at least one frame with opacity:0 before showing
        requestAnimationFrame(() => {
          img.classList.add('show');
          checkFitsWithinWrap(img, svgWrap);
        });
      };
      if (img.complete) show();
      else img.addEventListener('load', show, { once: true });

      // Hide the palette and zoom controls when complete.
      const paletteEl = document.querySelector('.palette');
      if (paletteEl) paletteEl.style.display = 'none';
      const zoomControlsEl = document.getElementById('zoomControls');
      if (zoomControlsEl) zoomControlsEl.style.display = 'none';

      renderTriviaPanel(svgWrap, puzzle);
    }

    async function main() {
      const loading = document.getElementById('loading');
      const svgWrap = document.getElementById('svgWrap');

      loading.textContent = t('loadingPuzzle');
      // Deliberately not shown until completion (see the trivia panel) —
      // the painting's title/artist would spoil the guessing game.
      const puzzle = await fetchActivePuzzle();

      const palette = puzzle.palette;
      const counterByNum = buildSwatches(palette);
      wireSwatchScrollHints(document.getElementById('swatches'));
      const paletteSelection = wirePaletteSelection();
      const cheatBtn = document.getElementById('cheatBtn');
      let cheatFn = null;

      function wireCheat() {
        if (!cheatBtn) return;
        const run = () => {
          if (typeof cheatFn === 'function') cheatFn();
        };
        cheatBtn.addEventListener('click', run);
        cheatBtn.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          e.preventDefault();
          run();
        });
      }
      wireCheat();

      // Zoom controls (+/-/reset) — wired once; they call into whichever
      // panzoom controller is currently active for the loaded puzzle.
      let panzoomCtl = null;
      function wireZoomControls() {
        const inBtn = document.getElementById('zoomInBtn');
        const outBtn = document.getElementById('zoomOutBtn');
        const resetBtn = document.getElementById('zoomResetBtn');
        const bind = (el, fn) => {
          if (!el) return;
          el.addEventListener('click', fn);
          el.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            e.preventDefault();
            fn();
          });
        };
        bind(inBtn, () => panzoomCtl && panzoomCtl.stepScale(1.6));
        bind(outBtn, () => panzoomCtl && panzoomCtl.stepScale(1 / 1.6));
        bind(resetBtn, () => panzoomCtl && panzoomCtl.reset());
      }
      wireZoomControls();

      // Show the pinch-to-zoom hint once per browser, on first load only.
      function maybeShowZoomHint() {
        let seen = false;
        try { seen = localStorage.getItem('pnb_zoom_hint_seen') === '1'; } catch (_e) { /* ignore */ }
        if (seen) return;
        const el = document.getElementById('zoomHint');
        if (!el) return;
        requestAnimationFrame(() => el.classList.add('show'));
        setTimeout(() => {
          el.classList.remove('show');
          try { localStorage.setItem('pnb_zoom_hint_seen', '1'); } catch (_e) { /* ignore */ }
        }, 3500);
      }
      maybeShowZoomHint();

      // Hints: highlight and zoom to an unpainted region of the selected
      // color. Limited per puzzle so it stays a nudge, not an autosolve.
      const HINT_LIMIT = 5;
      let hintsRemaining = HINT_LIMIT;
      let hintTargets = { annotated: null };
      const hintBtn = document.getElementById('hintBtn');

      function updateHintBtnLabel() {
        if (!hintBtn) return;
        hintBtn.textContent = hintsRemaining > 0 ? t('hintButtonCount', { count: hintsRemaining }) : t('hintButtonNone');
        if (hintsRemaining <= 0) hintBtn.setAttribute('disabled', 'true');
        else hintBtn.removeAttribute('disabled');
      }

      function pathLocalCenter(svg, path) {
        const vb = svg.viewBox.baseVal;
        const bbox = path.getBBox();
        const cx = bbox.x + bbox.width / 2;
        const cy = bbox.y + bbox.height / 2;
        const scaleFactor = Math.min(svg.clientWidth / vb.width, svg.clientHeight / vb.height);
        const offsetX = (svg.clientWidth - vb.width * scaleFactor) / 2;
        const offsetY = (svg.clientHeight - vb.height * scaleFactor) / 2;
        return {
          lx: offsetX + (cx - vb.x) * scaleFactor,
          ly: offsetY + (cy - vb.y) * scaleFactor,
        };
      }

      function useHint() {
        if (hintsRemaining <= 0 || !panzoomCtl || !hintTargets.annotated) return;
        const selectedNum = paletteSelection.getSelectedNum();
        if (selectedNum == null) {
          const label = document.getElementById('selectedLabel');
          if (label) {
            const prev = label.textContent;
            label.textContent = t('pickColorFirst');
            setTimeout(() => { label.textContent = prev; }, 1400);
          }
          return;
        }
        const candidate = hintTargets.annotated.querySelector(
          `path[data-color-num="${selectedNum}"][data-painted="0"]`
        );
        if (!candidate) return;

        hintsRemaining -= 1;
        updateHintBtnLabel();

        const { lx, ly } = pathLocalCenter(hintTargets.annotated, candidate);
        panzoomCtl.focusOnLocalPoint(lx, ly, Math.min(4, MAX_ZOOM));
        candidate.classList.remove('pnb-hint');
        void candidate.offsetWidth;
        candidate.classList.add('pnb-hint');
        setTimeout(() => candidate.classList.remove('pnb-hint'), 2200);
      }

      if (hintBtn) {
        hintBtn.addEventListener('click', useHint);
        hintBtn.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          e.preventDefault();
          useHint();
        });
      }

      async function loadAndShow(svgUrl, referenceImageUrl) {
        svgWrap.innerHTML = '';
        const fitWarningEl = document.getElementById('fitWarning');
        if (fitWarningEl) fitWarningEl.classList.remove('show');
        const msg = document.createElement('div');
        msg.className = 'loading';
        msg.textContent = t('loadingPainting');
        svgWrap.appendChild(msg);

        // Ensure palette is visible when starting/restarting a painting.
        const paletteEl = document.querySelector('.palette');
        if (paletteEl) paletteEl.style.display = '';

        const svg = await loadSvg(svgUrl);
        const annotated = annotateSvg(svg, palette);
        svgWrap.innerHTML = '';
        svgWrap.appendChild(annotated);

        hintTargets.annotated = annotated;
        hintsRemaining = HINT_LIMIT;
        updateHintBtnLabel();

        // Completion tracking: count paintable regions once per load.
        const paintable = Array.from(annotated.querySelectorAll('path')).filter(p => p.dataset.colorNum && p.dataset.colorNum !== '-1');
        const totalToPaint = paintable.length;
        let paintedCount = 0;

        // Per-color tracking for the palette UI.
        const totalByNum = new Map();
        const paintedByNum = new Map();
        for (const p of paintable) {
          const n = Number(p.dataset.colorNum);
          totalByNum.set(n, (totalByNum.get(n) || 0) + 1);
        }
        for (const c of palette) {
          paintedByNum.set(c.num, 0);
          // Reset swatches (they may have been marked done on a prior puzzle)
          const sw = document.querySelector(`.swatch[data-num="${c.num}"]`);
          if (sw) sw.classList.remove('done');
          setSwatchCount(counterByNum, c.num, 0, totalByNum.get(c.num) || 0);
        }

        function onCorrectPaint(_path) {
          paintedCount += 1;
          const n = Number(_path.dataset.colorNum);
          const next = (paintedByNum.get(n) || 0) + 1;
          paintedByNum.set(n, next);
          setSwatchCount(counterByNum, n, next, totalByNum.get(n) || 0);
          if (totalToPaint > 0 && paintedCount >= totalToPaint) {
            revealOriginalInWrap(svgWrap, referenceImageUrl, puzzle);
          }
        }

        // Cheat: paint everything correctly at once (only unpainted regions count)
        cheatFn = () => {
          for (const p of paintable) {
            if (p.dataset.painted === '1') continue;
            const fill = p.dataset.correctFill;
            if (fill) p.style.fill = fill;
            p.dataset.painted = '1';
            onCorrectPaint(p);
          }
        };

        // After insertion, refine viewBox to the real drawing bounds.
        requestAnimationFrame(() => {
          fitSvgToWrap(annotated);
          // Some browsers need a second frame if fonts/paths settle late.
          requestAnimationFrame(() => {
            fitSvgToWrap(annotated);
            // Now wire pan/zoom + tap-to-paint on the fitted SVG
            panzoomCtl = wireCanvasInteractions(annotated, svgWrap, paletteSelection, onCorrectPaint);
            checkFitsWithinWrap(annotated, svgWrap);
          });
        });
        window.addEventListener('resize', () => checkFitsWithinWrap(annotated, svgWrap));
      }

      await loadAndShow(puzzle.svgUrl, puzzle.referenceImageUrl);
    }

    async function boot() {
      I18N = await loadTranslations(LANG);
      document.documentElement.lang = LANG;
      applyStaticTranslations();
      wireTopbarHeightSync();
      await main();
    }

    boot().catch((err) => {
      console.error(err);
      const svgWrap = document.getElementById('svgWrap');
      svgWrap.innerHTML = '';
      const msg = document.createElement('div');
      msg.className = 'loading';
      const isFile = window.location.protocol === 'file:';
      msg.textContent = isFile
        ? t('errorFileProtocol')
        : t('errorGeneric', { message: err.message || err });
      svgWrap.appendChild(msg);
    });
  </script>
</body>
</html>
