      // Show the pinch-to-zoom hint once per browser, on first load only.
      function maybeShowZoomHint() {
        let seen = false;
        try { seen = localStorage.getItem('pnb_zoom_hint_seen') === '1'; } catch (_e) { /* ignore */ }
        if (seen) return;
        const el = document.getElementById('zoomHint');
        if (!el) return;
        requestAnimationFrame(() => el.classList.add('show'));
        setTimeout(() => {
          el.classList.remove('show');
          try { localStorage.setItem('pnb_zoom_hint_seen', '1'); } catch (_e) { /* ignore */ }
        }, 3500);
      }
      maybeShowZoomHint();

      // Hints: highlight and zoom to an unpainted region of the selected
      // color. Limited per puzzle so it stays a nudge, not an autosolve.
      const HINT_LIMIT = 5;
      let hintsRemaining = HINT_LIMIT;
      let hintTargets = { annotated: null };
      const hintBtn = document.getElementById('hintBtn');

      function updateHintBtnLabel() {
        if (!hintBtn) return;
        hintBtn.textContent = hintsRemaining > 0 ? t('hintButtonCount', { count: hintsRemaining }) : t('hintButtonNone');
        if (hintsRemaining <= 0) hintBtn.setAttribute('disabled', 'true');
        else hintBtn.removeAttribute('disabled');
      }

      function pathLocalCenter(svg, path) {
        const vb = svg.viewBox.baseVal;
        const bbox = path.getBBox();
        const cx = bbox.x + bbox.width / 2;
        const cy = bbox.y + bbox.height / 2;
        const scaleFactor = Math.min(svg.clientWidth / vb.width, svg.clientHeight / vb.height);
        const offsetX = (svg.clientWidth - vb.width * scaleFactor) / 2;
        const offsetY = (svg.clientHeight - vb.height * scaleFactor) / 2;
        return {
          lx: offsetX + (cx - vb.x) * scaleFactor,
          ly: offsetY + (cy - vb.y) * scaleFactor,
        };
      }

      function useHint() {
        if (hintsRemaining <= 0 || !panzoomCtl || !hintTargets.annotated) return;
        const selectedNum = paletteSelection.getSelectedNum();
        if (selectedNum == null) {
          const label = document.getElementById('selectedLabel');
          if (label) {
            const prev = label.textContent;
            label.textContent = t('pickColorFirst');
            setTimeout(() => { label.textContent = prev; }, 1400);
          }
          return;
        }
        const candidate = hintTargets.annotated.querySelector(
          `path[data-color-num="${selectedNum}"][data-painted="0"]`
        );
        if (!candidate) return;

        hintsRemaining -= 1;
        updateHintBtnLabel();

        const { lx, ly } = pathLocalCenter(hintTargets.annotated, candidate);
        panzoomCtl.focusOnLocalPoint(lx, ly, Math.min(4, MAX_ZOOM));
        candidate.classList.remove('pnb-hint');
        void candidate.offsetWidth;
        candidate.classList.add('pnb-hint');
        setTimeout(() => candidate.classList.remove('pnb-hint'), 2200);
      }

      if (hintBtn) {
        hintBtn.addEventListener('click', useHint);
        hintBtn.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          e.preventDefault();
          useHint();
        });
      }

      async function loadAndShow(svgUrl, referenceImageUrl) {
        svgWrap.innerHTML = '';
        const fitWarningEl = document.getElementById('fitWarning');
        if (fitWarningEl) fitWarningEl.classList.remove('show');
        const msg = document.createElement('div');
        msg.className = 'loading';
        msg.textContent = t('loadingPainting');
        svgWrap.appendChild(msg);

        // Ensure palette is visible when starting/restarting a painting.
        const paletteEl = document.querySelector('.palette');
        if (paletteEl) paletteEl.style.display = '';

        const svg = await loadSvg(svgUrl);
        const annotated = annotateSvg(svg, palette);
        svgWrap.innerHTML = '';
        svgWrap.appendChild(annotated);

        hintTargets.annotated = annotated;
        hintsRemaining = HINT_LIMIT;
        updateHintBtnLabel();

        // Completion tracking: count paintable regions once per load.
        const paintable = Array.from(annotated.querySelectorAll('path')).filter(p => p.dataset.colorNum && p.dataset.colorNum !== '-1');
        const totalToPaint = paintable.length;
        let paintedCount = 0;

        // Per-color tracking for the palette UI.
        const totalByNum = new Map();
        const paintedByNum = new Map();
        paintable.forEach((p, i) => {
          p.dataset.pnbIndex = String(i);
          const n = Number(p.dataset.colorNum);
          totalByNum.set(n, (totalByNum.get(n) || 0) + 1);
        });
        currentPaintable = paintable;
        for (const c of palette) {
          paintedByNum.set(c.num, 0);
          // Reset swatches (they may have been marked done on a prior puzzle)
          const sw = document.querySelector(`.swatch[data-num="${c.num}"]`);
          if (sw) sw.classList.remove('done');
          setSwatchCount(counterByNum, c.num, 0, totalByNum.get(c.num) || 0);
        }

        function onCorrectPaint(_path) {
          paintedCount += 1;
          const n = Number(_path.dataset.colorNum);
          const next = (paintedByNum.get(n) || 0) + 1;
          paintedByNum.set(n, next);
          setSwatchCount(counterByNum, n, next, totalByNum.get(n) || 0);
          updateNumberVisibility(_path);
          markPathPainted(puzzle.puzzleId, Number(_path.dataset.pnbIndex));
          if (totalToPaint > 0 && paintedCount >= totalToPaint) {
            markPuzzleCompleted(puzzle.puzzleId);
            revealOriginalInWrap(svgWrap, referenceImageUrl, puzzle);
          }
        }

        // Restore any previously painted regions for this puzzle (e.g. the
        // user left for the menu, or is reopening a finished puzzle).
        const savedProgress = getPuzzleProgress(puzzle.puzzleId);
        for (const index of savedProgress.painted) {
          const p = paintable[index];
          if (!p || p.dataset.painted === '1') continue;
          const fill = p.dataset.correctFill;
          if (fill) p.style.fill = fill;
          p.dataset.painted = '1';
          onCorrectPaint(p);
        }

        // Cheat: paint every unpainted region except one, always leaving at
        // least one region for the user to paint themselves — so cheating
        // never finishes the puzzle outright, no matter how many times it's
        // pressed.
        cheatFn = () => {
          const unpainted = paintable.filter((p) => p.dataset.painted !== '1');
          unpainted.pop();
          for (const p of unpainted) {
            const fill = p.dataset.correctFill;
            if (fill) p.style.fill = fill;
            p.dataset.painted = '1';
            onCorrectPaint(p);
          }
        };

        // After insertion, refine viewBox to the real drawing bounds.
        requestAnimationFrame(() => {
          fitSvgToWrap(annotated);
          // Some browsers need a second frame if fonts/paths settle late.
          requestAnimationFrame(() => {
            fitSvgToWrap(annotated);
            // Now wire pan/zoom + tap-to-paint on the fitted SVG
            panzoomCtl = wireCanvasInteractions(annotated, svgWrap, paletteSelection, onCorrectPaint);
            checkFitsWithinWrap(annotated, svgWrap);
          });
        });
        window.addEventListener('resize', () => checkFitsWithinWrap(annotated, svgWrap));
      }

      await loadAndShow(puzzle.svgUrl, puzzle.referenceImageUrl);
    }

    // Navigation is reload-based: main()'s setup (buildSwatches, wireZoomControls,
    // etc.) assumes it runs exactly once per page life, so switching puzzles goes
    // through a fresh `boot()` rather than trying to safely re-run that setup in-page.
    function parsePuzzleHash(hash) {
      const m = /^#puzzle=(.+)$/.exec(hash || '');
      return m ? decodeURIComponent(m[1]) : null;
    }

    function goToPuzzle(idOrToday) {
      location.hash = `puzzle=${encodeURIComponent(idOrToday)}`;
      location.reload();
    }

    function backToMenu() {
      location.hash = '';
      location.reload();
    }

    function menuStatusLabel(progress) {
      if (progress.completed) return t('menuStatusCompleted');
      if (progress.painted.length > 0) return t('menuStatusInProgress');
      return t('menuStatusNotStarted');
    }

    function setMenuThumb(thumbEl, referenceImageUrl, completed) {
      if (completed) {
        thumbEl.textContent = '';
        thumbEl.style.backgroundImage = `url("${referenceImageUrl}")`;
        thumbEl.style.backgroundSize = 'cover';
        thumbEl.style.backgroundPosition = 'center';
      } else {
        thumbEl.textContent = '🎨';
        thumbEl.style.backgroundImage = 'none';
      }
    }

    // Shared by the menu's horizontal strip and the archive grid — a button
    // card for one past puzzle. Labeled by its release order ("#N"), not its
    // date — see fetchNumberedPuzzleHistory.
    function buildHistoryCard(row) {
      const progress = getPuzzleProgress(row.puzzleId);
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'menuHistoryItem';

      const thumb = document.createElement('div');
      thumb.className = 'menuThumb';
      setMenuThumb(thumb, row.referenceImageUrl, progress.completed);

      const number = document.createElement('div');
      number.className = 'menuHistoryNumber';
      number.textContent = t('menuPuzzleNumber', { num: row.number });
      const status = document.createElement('div');
      status.className = 'menuStatus';
      status.textContent = menuStatusLabel(progress);

      item.appendChild(thumb);
      item.appendChild(number);
      item.appendChild(status);
      item.addEventListener('click', () => goToPuzzle(row.puzzleId));
      return item;
    }

    async function renderMenu() {
      document.getElementById('menuOverlay').classList.add('show');

      const todayStatusEl = document.getElementById('menuTodayStatus');
      const historyStripEl0 = document.getElementById('menuHistoryStrip');
      todayStatusEl.textContent = t('loading');
      historyStripEl0.innerHTML = '';

      const [todayResult, historyResult] = await Promise.allSettled([fetchActivePuzzle(), fetchRecentPuzzleHistory()]);

      const todayCard = document.getElementById('menuTodayCard');
      const todayThumb = document.getElementById('menuTodayThumb');
      const todayStatus = document.getElementById('menuTodayStatus');
      if (todayResult.status === 'fulfilled') {
        const progress = getPuzzleProgress(todayResult.value.puzzleId);
        todayStatus.textContent = menuStatusLabel(progress);
        setMenuThumb(todayThumb, todayResult.value.referenceImageUrl, progress.completed);
        todayCard.addEventListener('click', () => goToPuzzle('today'));
      } else {
        console.error(todayResult.reason);
        todayStatus.textContent = t('errorNoActivePuzzle');
        todayCard.disabled = true;
      }

      const historyStripEl = document.getElementById('menuHistoryStrip');
      historyStripEl.innerHTML = '';
      const historyRows = historyResult.status === 'fulfilled' ? historyResult.value : [];
      if (historyResult.status === 'rejected') console.error(historyResult.reason);
      if (!historyRows.length) {
        const empty = document.createElement('div');
        empty.className = 'menuHistoryEmpty';
        empty.textContent = t('menuHistoryEmpty');
        historyStripEl.appendChild(empty);
      } else {
        for (const row of historyRows) {
          historyStripEl.appendChild(buildHistoryCard(row));
        }
      }

      wireArchive();
    }

    // Archive state: fetched once, lazily, on first open — a flat, numbered
    // list (no date-based grouping), so opening it again just re-renders the
    // already-fetched array with no repeat network round trip.
    let archiveRows = null;

    function renderArchiveGrid() {
      const grid = document.getElementById('archiveGrid');
      grid.innerHTML = '';

      if (!archiveRows.length) {
        const empty = document.createElement('div');
        empty.className = 'archiveEmpty';
        empty.textContent = t('archiveEmpty');
        grid.appendChild(empty);
        return;
      }

      for (const row of archiveRows) {
        grid.appendChild(buildHistoryCard(row));
      }
    }

    async function openArchive() {
      document.getElementById('archiveOverlay').classList.add('show');
      if (!archiveRows) {
        const grid = document.getElementById('archiveGrid');
        grid.textContent = t('loading');
        archiveRows = await fetchPuzzleArchive();
      }
      renderArchiveGrid();
    }

    function closeArchive() {
      document.getElementById('archiveOverlay').classList.remove('show');
    }

    function wireArchive() {
      const openBtn = document.getElementById('menuArchiveBtn');
      openBtn.addEventListener('click', openArchive);
      document.getElementById('archiveCloseBtn').addEventListener('click', closeArchive);
    }

    function wireHomeButton() {
      const btn = document.getElementById('homeBtn');
      btn.classList.add('show');
      const topbar = document.querySelector('.topbar');
      if (topbar) topbar.classList.add('hasBack');
      btn.addEventListener('click', backToMenu);
      btn.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        backToMenu();
      });
    }

    function wireNumbersToggle() {
      const btn = document.getElementById('numbersToggleBtn');
      btn.classList.add('show');
      const topbar = document.querySelector('.topbar');
      if (topbar) topbar.classList.add('hasNumbersToggle');

      const applyState = () => {
        btn.classList.toggle('active', hideNumbersEnabled);
        btn.setAttribute('aria-pressed', String(hideNumbersEnabled));
      };
      applyState();

      const activate = () => {
        hideNumbersEnabled = !hideNumbersEnabled;
        saveHideNumbersPref(hideNumbersEnabled);
        applyState();
        refreshAllNumberVisibility();
      };
      btn.addEventListener('click', activate);
      btn.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        activate();
      });
    }

    // On native (iOS/Android), Capacitor shows a static launch splash from native
    // code before any web content loads. `#splashOverlay` is plain HTML/CSS (no JS
    // needed to paint it, and it keeps animating via CSS alone), so the instant the
    // web view can render anything, it already matches — hide the native splash
    // right away rather than waiting on the network, closing the gap that used to
    // flash black/blank between native splash and app content.
    function hideNativeSplash() {
      const splashScreen = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen;
      if (splashScreen) splashScreen.hide();
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    // Matches the .splashSwatch CSS: the last swatch starts its 2.4s color-cycle
    // after a 0.6s stagger delay, so 3000ms is when every swatch has completed
    // one full cycle. Keep this in sync if those CSS values change.
    const SPLASH_ANIMATION_MS = 3000;

    function hideWebSplash() {
      const el = document.getElementById('splashOverlay');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(() => { el.style.display = 'none'; }, 300);
    }

    async function boot() {
      hideNativeSplash();
      wireViewportHeightSync();

      // The animated splash is a first-impression/branding moment, not a generic
      // "please wait" spinner — it should only play once per app session (native
      // cold start), not replay in full on every in-app menu<->puzzle navigation
      // (which is reload-based, see goToPuzzle/backToMenu). sessionStorage survives
      // those reloads (same WebView instance) but resets on a real app relaunch.
      const isFirstBoot = !sessionStorage.getItem('pnb_booted');
      try { sessionStorage.setItem('pnb_booted', '1'); } catch (_e) { /* ignore */ }
      if (!isFirstBoot) {
        const splashEl = document.getElementById('splashOverlay');
        if (splashEl) splashEl.style.display = 'none';
      }

      const bootStarted = Date.now();
      try {
        I18N = await loadTranslations(LANG);
        document.documentElement.lang = LANG;
        applyStaticTranslations();
        wireTopbarHeightSync();

        const requested = parsePuzzleHash(location.hash);
        if (requested === null) {
          await renderMenu();
          return;
        }
        wireHomeButton();
        wireNumbersToggle();
        const puzzle = requested === 'today' ? await fetchActivePuzzle() : await fetchPuzzleById(requested);
        await main(puzzle);
      } finally {
        if (isFirstBoot) {
          const remaining = SPLASH_ANIMATION_MS - (Date.now() - bootStarted);
          if (remaining > 0) await sleep(remaining);
          hideWebSplash();
        }
      }
    }

    wireDebugBanner();

    boot().catch((err) => {
      console.error(err);
      showDebugBanner(`boot() failed: ${err.message || err}\n\nSUPABASE_URL: ${SUPABASE_URL}`);
      // #svgWrap only exists on the puzzle route (renderMenu's failures are
      // handled inline instead) — guard rather than assume it's present.
      const svgWrap = document.getElementById('svgWrap');
      if (!svgWrap) return;
      svgWrap.innerHTML = '';
      const msg = document.createElement('div');
      msg.className = 'loading';
      const isFile = window.location.protocol === 'file:';
      msg.textContent = isFile
        ? t('errorFileProtocol')
        : t('errorGeneric', { message: err.message || err });
      svgWrap.appendChild(msg);
    });
  </script>
</body>
</html>
