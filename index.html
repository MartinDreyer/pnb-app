    // Belt-and-suspenders check: confirm the rendered element is actually fully
    // contained within its wrapper (a couple of CSS px of rounding is fine). If it's
    // ever not — a future regression, an unusual device viewport, etc. — surface a
    // visible warning instead of silently letting the bottom get clipped off.
    function checkFitsWithinWrap(el, wrapEl) {
      const warningEl = document.getElementById('fitWarning');
      if (!warningEl) return;
      // The puzzle SVG is torn out of the DOM once the puzzle is completed
      // (see revealOriginalInWrap) but this fn stays bound to a resize
      // listener referencing it — a later resize/orientation-change would
      // otherwise see a detached, zero-sized el and wrongly flag "doesn't
      // fit" over the finished reveal screen.
      if (!el.isConnected) return;
      const elRect = el.getBoundingClientRect();
      const wrapRect = wrapEl.getBoundingClientRect();
      const tolerance = 1;
      const fits =
        elRect.width > 0 &&
        elRect.height > 0 &&
        elRect.top >= wrapRect.top - tolerance &&
        elRect.left >= wrapRect.left - tolerance &&
        elRect.bottom <= wrapRect.bottom + tolerance &&
        elRect.right <= wrapRect.right + tolerance;
      warningEl.classList.toggle('show', !fits);
      if (!fits) {
        console.warn('Puzzle does not fully fit its container', { elRect, wrapRect });
      }
    }

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 5;

    // Combines pan/zoom with tap-to-paint. Touch taps are detected directly
    // from touchstart/touchend (movement + duration thresholds) and painted
    // immediately, rather than waiting on a browser-synthesized 'click' —
    // which after our own pan/zoom transform is often delayed or dropped
    // entirely, making taps feel unresponsive on phones/tablets.
    function wireCanvasInteractions(svg, wrapEl, paletteSelection, onCorrectPaint) {
      // Pan/zoom state applies a CSS transform to the SVG element.
      const state = {
        scale: 1,
        tx: 0,
        ty: 0,
        mode: null, // 'pan' | 'pinch'
        startX: 0,
        startY: 0,
        startTx: 0,
        startTy: 0,
        startScale: 1,
        startDist: 0,
        pinchSvgX: 0,
        pinchSvgY: 0,
        tapStartX: 0,
        tapStartY: 0,
        tapStartTime: 0,
        tapMoved: false,
        suppressClickUntil: 0,
      };

      const TAP_MOVE_THRESHOLD = 14; // px
      const TAP_MAX_DURATION = 350; // ms
      const TAP_TOLERANCE_RINGS = [0, 8, 14, 22]; // screen px — expanding search radius for a near-miss tap
      const TAP_TOLERANCE_DIRECTIONS = 8;

      // A tap rarely lands on the exact pixel the user meant, and a number
      // label's own hit area can sit exactly on top of the region it labels
      // (elementFromPoint returns whichever the browser deems "on top" there,
      // which can be the text node, not the path under it). So rather than a
      // single exact-point hit test, sample a small expanding ring of nearby
      // points and prefer whichever path matches the selected color — this is
      // what makes a near-miss tap still paint the intended region instead of
      // requiring the user to hunt for the exact spot.
      function findTappablePath(x, y, selectedNum) {
        let fallback = null;
        for (const radius of TAP_TOLERANCE_RINGS) {
          const points = radius === 0
            ? [[x, y]]
            : Array.from({ length: TAP_TOLERANCE_DIRECTIONS }, (_, i) => {
                const angle = (i / TAP_TOLERANCE_DIRECTIONS) * Math.PI * 2;
                return [x + Math.cos(angle) * radius, y + Math.sin(angle) * radius];
              });
          for (const [px, py] of points) {
            const stack = document.elementsFromPoint(px, py);
            const path = stack.find((el) => el.tagName === 'path');
            if (!path) continue;
            if (selectedNum != null && path.dataset.colorNum === selectedNum) return path;
            if (!fallback) fallback = path;
          }
        }
        return fallback;
      }

      function attemptPaint(path) {
        if (!path) return;
        const selectedNum = paletteSelection.getSelectedNum();
        const selectedRgb = paletteSelection.getSelectedRgb();
        if (selectedNum == null || selectedRgb == null) return;

        const needed = path.dataset.colorNum;
        if (needed !== selectedNum) {
          if (needed !== '-1') {
            path.classList.remove('pnb-wrong');
            // Force reflow so a rapid re-tap re-triggers the animation.
            void path.offsetWidth;
            path.classList.add('pnb-wrong');
          }
          return;
        }
        if (path.dataset.painted === '1') return;
        path.style.fill = selectedRgb;
        path.dataset.painted = '1';
        // Only on a real live tap — cheat-fill and progress-restoration also
        // paint via onCorrectPaint, but animating dozens of regions at once
        // for those would be noisy rather than a satisfying per-tap reaction.
        path.classList.add('pnb-correct');
        if (typeof onCorrectPaint === 'function') onCorrectPaint(path);
      }

      function apply() {
        svg.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
      }

      function clamp() {
        const w = wrapEl.clientWidth;
        const h = wrapEl.clientHeight;
        if (!w || !h) return;

        const scaledW = w * state.scale;
        const scaledH = h * state.scale;

        if (state.scale <= 1) {
          state.tx = (w - scaledW) / 2;
          state.ty = (h - scaledH) / 2;
        } else {
          const minTx = w - scaledW;
          const minTy = h - scaledH;
          if (state.tx > 0) state.tx = 0;
          if (state.ty > 0) state.ty = 0;
          if (state.tx < minTx) state.tx = minTx;
          if (state.ty < minTy) state.ty = minTy;
        }
      }

      function setScale(nextScale, centerX, centerY) {
        const s = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, nextScale));

        // Keep the point under (centerX, centerY) stable.
        const svgX = (centerX - state.tx) / state.scale;
        const svgY = (centerY - state.ty) / state.scale;
        state.scale = s;
        state.tx = centerX - svgX * state.scale;
        state.ty = centerY - svgY * state.scale;
        clamp();
        apply();
      }

      // Zoom in/out one step, centered on the wrap's visible middle — used by
      // the on-screen +/- buttons so zoom feels controlled and deliberate.
      function stepScale(factor) {
        const w = wrapEl.clientWidth;
        const h = wrapEl.clientHeight;
        setScale(state.scale * factor, w / 2, h / 2);
      }

      // Pan/zoom so the given point (in the SVG element's own untransformed
      // CSS-pixel box) is centered in the wrap, at the given scale. Used by
      // the hint feature to jump to an unpainted region.
      function focusOnLocalPoint(lx, ly, targetScale) {
        const w = wrapEl.clientWidth;
        const h = wrapEl.clientHeight;
        const s = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, targetScale));
        state.scale = s;
        state.tx = w / 2 - s * lx;
        state.ty = h / 2 - s * ly;
        clamp();
        apply();
      }

      // Reset to fit (scale=1, centered) after we have the final viewBox.
      function reset() {
        state.scale = 1;
        state.tx = 0;
        state.ty = 0;
        clamp();
        apply();
      }

      function dismissZoomHint() {
        const el = document.getElementById('zoomHint');
        if (el) el.classList.remove('show');
        try { localStorage.setItem('pnb_zoom_hint_seen', '1'); } catch (_e) { /* ignore */ }
      }

      // Touch events (best support on iPad Safari)
      function getCenter(t1, t2) {
        const rect = wrapEl.getBoundingClientRect();
        return {
          x: ((t1.clientX + t2.clientX) / 2) - rect.left,
          y: ((t1.clientY + t2.clientY) / 2) - rect.top,
        };
      }

      function dist(t1, t2) {
        const dx = t2.clientX - t1.clientX;
        const dy = t2.clientY - t1.clientY;
        return Math.hypot(dx, dy);
      }

      svg.addEventListener('touchstart', (e) => {
        dismissZoomHint();
        if (e.touches.length === 1) {
          state.mode = 'pan';
          const rect = wrapEl.getBoundingClientRect();
          state.startX = e.touches[0].clientX - rect.left;
          state.startY = e.touches[0].clientY - rect.top;
          state.startTx = state.tx;
          state.startTy = state.ty;

          // Tap tracking (independent of pan, which only kicks in once the
          // finger actually moves past the threshold below).
          state.tapStartX = e.touches[0].clientX;
          state.tapStartY = e.touches[0].clientY;
          state.tapStartTime = Date.now();
          state.tapMoved = false;
        } else if (e.touches.length === 2) {
          state.tapMoved = true; // a second finger means this isn't a tap
          state.mode = 'pinch';
          state.startScale = state.scale;
          state.startTx = state.tx;
          state.startTy = state.ty;
          state.startDist = dist(e.touches[0], e.touches[1]);
          const c = getCenter(e.touches[0], e.touches[1]);
          // Record the SVG-space point under the pinch center at start.
          state.pinchSvgX = (c.x - state.startTx) / state.startScale;
          state.pinchSvgY = (c.y - state.startTy) / state.startScale;
        }
      }, { passive: true });

      svg.addEventListener('touchmove', (e) => {
        // Prevent page scroll/zoom while interacting with the canvas.
        e.preventDefault();
        if (state.mode === 'pan' && e.touches.length === 1) {
          const rect = wrapEl.getBoundingClientRect();
          const x = e.touches[0].clientX - rect.left;
          const y = e.touches[0].clientY - rect.top;
          state.tx = state.startTx + (x - state.startX);
          state.ty = state.startTy + (y - state.startY);
          clamp();
          apply();
          // Judge "was this a tap or a drag" by how far the artwork actually
          // moved on screen (post-clamp), not raw finger movement. At the
          // default zoom level clamp() pins tx/ty in place, so ordinary
          // finger jitter during a tap never gets misread as a drag.
          const movedX = Math.abs(state.tx - state.startTx);
          const movedY = Math.abs(state.ty - state.startTy);
          if (movedX > TAP_MOVE_THRESHOLD || movedY > TAP_MOVE_THRESHOLD) state.tapMoved = true;
        } else if (state.mode === 'pinch' && e.touches.length === 2) {
          const d = dist(e.touches[0], e.touches[1]);
          if (!state.startDist) return;
          const nextScale = state.startScale * (d / state.startDist);
          const c = getCenter(e.touches[0], e.touches[1]);

          // Scale around pinch center (using the SVG-space point captured at start).
          const s = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, nextScale));
          state.scale = s;
          state.tx = c.x - state.pinchSvgX * state.scale;
          state.ty = c.y - state.pinchSvgY * state.scale;
          clamp();
          apply();
        }
      }, { passive: false });

      svg.addEventListener('touchend', (e) => {
        const wasPan = state.mode === 'pan';
        state.mode = null;
        if (!wasPan || state.tapMoved) return;
        if (Date.now() - state.tapStartTime > TAP_MAX_DURATION) return;
        // A clean, un-moved, quick single-finger touch: paint immediately
        // instead of waiting on a synthetic click event.
        const path = findTappablePath(state.tapStartX, state.tapStartY, paletteSelection.getSelectedNum());
        if (path) attemptPaint(path);
        state.suppressClickUntil = Date.now() + 600;
      }, { passive: true });
      svg.addEventListener('touchcancel', (_e) => {
        state.mode = null;
      }, { passive: true });

      // Mouse/keyboard/fallback path — ignored right after a touch tap already
      // handled the paint, so a delayed synthetic click doesn't double-fire.
      svg.addEventListener('click', (e) => {
        if (Date.now() < state.suppressClickUntil) return;
        const path = findTappablePath(e.clientX, e.clientY, paletteSelection.getSelectedNum());
        if (path) attemptPaint(path);
      });

      // Mouse wheel zoom (desktop)
      svg.addEventListener('wheel', (e) => {
        e.preventDefault();
        dismissZoomHint();
        const rect = wrapEl.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const factor = Math.exp(-e.deltaY * 0.0015);
        setScale(state.scale * factor, x, y);
      }, { passive: false });

      // Mouse drag pan (desktop)
      let mouseDown = false;
      svg.addEventListener('mousedown', (e) => {
        dismissZoomHint();
        mouseDown = true;
        const rect = wrapEl.getBoundingClientRect();
        state.mode = 'pan';
        state.startX = e.clientX - rect.left;
        state.startY = e.clientY - rect.top;
        state.startTx = state.tx;
        state.startTy = state.ty;
      });
      window.addEventListener('mousemove', (e) => {
        if (!mouseDown || state.mode !== 'pan') return;
        const rect = wrapEl.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        state.tx = state.startTx + (x - state.startX);
        state.ty = state.startTy + (y - state.startY);
        clamp();
        apply();
      });
      window.addEventListener('mouseup', () => {
        mouseDown = false;
        state.mode = null;
      });

      window.addEventListener('resize', () => {
        clamp();
        apply();
      });

      reset();
      return { reset, setScale, stepScale, focusOnLocalPoint, getScale: () => state.scale };
    }

    function buildSwatches(palette) {
      const swatches = document.getElementById('swatches');
      swatches.innerHTML = '';
      const counterByNum = new Map();
      for (const c of palette) {
        const el = document.createElement('div');
        el.className = 'swatch';
        el.setAttribute('role', 'button');
        el.setAttribute('tabindex', '0');
        el.setAttribute('aria-label', t('colorAriaLabel', { num: c.num }));
        el.dataset.num = String(c.num);
        el.dataset.rgb = cssRgb(c.rgb);

        const inner = document.createElement('div');
        inner.className = 'swatchInner';
        inner.style.background = cssRgb(c.rgb);

        const num = document.createElement('div');
        num.className = 'swatchNum';
        num.textContent = String(c.num);

        const count = document.createElement('div');
        count.className = 'swatchCount empty';
        count.textContent = '';
        count.dataset.num = String(c.num);
        counterByNum.set(c.num, count);

        const check = document.createElement('div');
        check.className = 'swatchCheck';
        check.textContent = '✓';

        // Layout: number (top), color square (middle), counter (bottom)
        el.appendChild(num);
        el.appendChild(inner);
        el.appendChild(count);
        el.appendChild(check);
        swatches.appendChild(el);
      }

      // Add a cheat button at the end — always after any completed colors.
      const cheat = document.createElement('div');
      cheat.className = 'swatch cheat';
      cheat.style.order = '100';
      cheat.id = 'cheatBtn';
      cheat.setAttribute('role', 'button');
      cheat.setAttribute('tabindex', '0');
      cheat.setAttribute('aria-label', t('cheatAriaLabel'));

      const cheatTop = document.createElement('div');
      cheatTop.className = 'swatchNum';
      cheatTop.textContent = t('cheatTop');

      const cheatMid = document.createElement('div');
      cheatMid.className = 'swatchInner';
      cheatMid.style.background = '#FFFFFF';
      cheatMid.style.borderStyle = 'dashed';
      cheatMid.style.borderColor = 'rgba(0,0,0,0.25)';

      const cheatBottom = document.createElement('div');
      cheatBottom.className = 'swatchCount';
      cheatBottom.textContent = t('cheatBottom');

      cheat.appendChild(cheatTop);
      cheat.appendChild(cheatMid);
      cheat.appendChild(cheatBottom);
      swatches.appendChild(cheat);

      return counterByNum;
    }

    // The swatch row scrolls horizontally, but on a narrow phone only ~4
    // colors fit on screen at once — without a cue, it can look like the
    // whole palette rather than a scrollable strip. Edge fades signal
    // there's more in whichever direction still has content, and a one-time
    // nudge scroll (per browser) makes the scrollability unmistakable.
    function wireSwatchScrollHints(swatchesEl) {
      const leftFade = document.getElementById('swatchFadeLeft');
      const rightFade = document.getElementById('swatchFadeRight');
      if (!leftFade || !rightFade) return;

      function update() {
        const hasOverflow = swatchesEl.scrollWidth > swatchesEl.clientWidth + 1;
        leftFade.classList.toggle('show', hasOverflow && swatchesEl.scrollLeft > 4);
        rightFade.classList.toggle(
          'show',
          hasOverflow && swatchesEl.scrollLeft < swatchesEl.scrollWidth - swatchesEl.clientWidth - 4
        );
      }

      swatchesEl.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', update);
      update();

      let seen = false;
      try { seen = localStorage.getItem('pnb_swatch_hint_seen') === '1'; } catch (_e) { /* ignore */ }
      if (!seen && swatchesEl.scrollWidth > swatchesEl.clientWidth + 1) {
        setTimeout(() => {
          swatchesEl.scrollTo({ left: 46, behavior: 'smooth' });
          setTimeout(() => swatchesEl.scrollTo({ left: 0, behavior: 'smooth' }), 550);
        }, 500);
        try { localStorage.setItem('pnb_swatch_hint_seen', '1'); } catch (_e) { /* ignore */ }
      }
    }

    function setSwatchCount(counterByNum, colorNum, painted, total) {
      const el = counterByNum.get(colorNum);
      if (!el) return;
      if (!total || total <= 0) {
        el.textContent = '';
        el.classList.add('empty');
        return;
      }
      el.textContent = `${painted}/${total}`;
      el.classList.remove('empty');

      // When a color is fully completed, move its swatch to the end of the
      // row and mark it done instead of hiding it — keeps a visible record
      // of progress rather than making colors vanish.
      const swatch = el.closest('.swatch');
      if (swatch && swatch.id !== 'cheatBtn') {
        swatch.classList.toggle('done', painted >= total);
      }
    }

    function wirePaletteSelection() {
      let selectedNum = null;
      let selectedRgb = null;

      const selectedLabel = document.getElementById('selectedLabel');
      const selectedChip = document.getElementById('selectedChip');
      const swatches = document.getElementById('swatches');

      function setSelected(el) {
        for (const node of swatches.querySelectorAll('.swatch')) node.classList.remove('active');
        el.classList.add('active');
        selectedNum = el.dataset.num;
        selectedRgb = el.dataset.rgb;
        selectedLabel.textContent = t('selectedNum', { num: selectedNum });
        selectedChip.style.background = selectedRgb;
        selectedChip.classList.add('show');
        // Bring the chosen swatch into view — with many colors in the row,
        // the active one can otherwise end up scrolled off to either side.
        el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }

      swatches.addEventListener('click', (e) => {
        const el = e.target.closest('.swatch');
        if (!el) return;
        if (el.id === 'cheatBtn') return;
        setSelected(el);
      });

      swatches.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const el = e.target.closest('.swatch');
        if (!el) return;
        e.preventDefault();
        if (el.id === 'cheatBtn') return;
        setSelected(el);
      });

      return {
        getSelectedNum: () => selectedNum,
        getSelectedRgb: () => selectedRgb,
      };
    }

    function annotateSvg(svg, palette) {
      const rgbToNum = new Map(palette.map(c => [rgbKey(c.rgb), c.num]));

      const paths = svg.querySelectorAll('path');
      for (const p of paths) {
        // Determine the correct fill from its original style/fill.
        const styleStr = p.getAttribute('style') || '';
        let rgb = parseFillFromStyle(styleStr);
        if (!rgb) {
          const fillAttr = p.getAttribute('fill');
          const m = /^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i.exec(fillAttr || '');
          if (m) rgb = [Number(m[1]), Number(m[2]), Number(m[3])];
        }

        const num = rgb ? (rgbToNum.get(rgbKey(rgb)) ?? -1) : -1;
        p.dataset.colorNum = String(num);
        if (rgb) p.dataset.correctFill = cssRgb(rgb);
        p.dataset.painted = '0';

        // Hide until painted.
        p.style.fill = 'rgb(255,255,255)';
      }

      return svg;
    }

    const SMK_API_BASE_URL = 'https://api.smk.dk/api/v1';

    // SMK's /art items carry an `enrichment_url` (https://enrichment.api.smk.dk/api/enrichment/{object_number})
    // pointing at a separate service with per-object computed data: MS Computer Vision
    // tags, Wikidata links, color extraction, etc. Not every object has every type, and
    // some objects have only empty stub records, so every lookup below is optional.
    async function fetchEnrichment(enrichmentUrl) {
      try {
        const res = await fetch(enrichmentUrl);
        if (!res.ok) return null;
        const records = await res.json();
        return Array.isArray(records) ? records : null;
      } catch (err) {
        console.error('SMK enrichment fetch failed', err);
        return null;
      }
    }

    // Real lookup against SMK's own open API (the same source the generator backend
    // pulls paintings from), keyed by the painting's smk_object_number. SMK doesn't
    // expose an art-movement/style field or a ready-made "fun fact", so those are
    // assembled from the fields it does have (object type, technique/materials,
    // the artist's lifespan, acquisition year), enriched with the enrichment API's
    // Wikidata link and computer-vision tags where available.
    async function fetchPaintingTrivia(objectNumber, title, artist) {
      if (!objectNumber) throw new Error('No smk_object_number for this painting');

      const params = new URLSearchParams({ object_number: objectNumber, lang: LANG === 'da' ? 'da' : 'en' });
      const res = await fetch(`${SMK_API_BASE_URL}/art?${params.toString()}`);
      if (!res.ok) throw new Error(`SMK API HTTP ${res.status}`);
      const data = await res.json();
      const item = data.items && data.items[0];
      if (!item) throw new Error(`No SMK data for ${objectNumber}`);

      const production = (item.production && item.production[0]) || {};
      const year = (item.production_date && item.production_date[0] && item.production_date[0].period) || '';
      const style = (item.object_names || []).map((o) => o.name).filter(Boolean).join(', ');
      const mediumSource = item.techniques && item.techniques.length ? item.techniques : item.materials || [];
      const medium = mediumSource.filter(Boolean).join(', ');

      let period = '';
      if (production.creator_date_of_birth && production.creator_date_of_death) {
        period = t('triviaLifespan', {
          birth: new Date(production.creator_date_of_birth).getFullYear(),
          death: new Date(production.creator_date_of_death).getFullYear(),
        });
      }

      const langSuffix = LANG === 'da' ? 'da' : 'en';
      let tags = [];
      let wikidataUrl = '';
      if (item.enrichment_url) {
        const enrichment = await fetchEnrichment(item.enrichment_url);
        if (enrichment) {
          const vision = enrichment.find((rec) => rec.type === 'msvisioncomponent');
          if (vision && vision.data) {
            tags = (vision.data[`tags_${langSuffix}`] || []).slice(0, 6);
          }
          const wikidata = enrichment.find((rec) => rec.type === 'wikidata');
          if (wikidata && wikidata.data) {
            wikidataUrl = wikidata.data[`wikidata_link_${langSuffix}_s`] || wikidata.data.wikidata_link_neutral_s || '';
          }
        }
      }

      const artistName = artist || t('triviaArtistFallback');
      const acquisitionYear = item.acquisition_date ? new Date(item.acquisition_date).getFullYear() : null;
      let funFact = '';
      if (tags.length) {
        funFact = t('triviaFunFactTags', { tags: tags.join(', ') });
      } else if (medium && acquisitionYear) {
        funFact = t('triviaFunFactAcquired', { artist: artistName, medium, year: acquisitionYear });
      } else if (medium) {
        funFact = t('triviaFunFactMedium', { artist: artistName, medium });
      }

      return { year, period, style, medium, funFact, wikidataUrl };
    }

    function renderTriviaPanel(svgWrap, puzzle) {
      const panel = document.createElement('div');
      panel.className = 'triviaPanel';
      panel.id = 'triviaPanel';

      const title = document.createElement('div');
      title.className = 'triviaTitle';
      title.textContent = puzzle.title || t('triviaUntitled');

      const artist = document.createElement('div');
      artist.className = 'triviaArtist';
      artist.textContent = puzzle.artist || '';

      const loading = document.createElement('div');
      loading.className = 'triviaLoading';
      loading.textContent = t('triviaLoading');

      panel.appendChild(title);
      panel.appendChild(artist);

      // AI-researched blurb: generated once server-side when the painting was first
      // pulled (see paintbynumbersgenerator-master/backend/src/enrichment.ts), stored
      // on the painting row — no network call needed here, and no "loading" state,
      // unlike the trivia fetch below. Always paired with a disclaimer, since it can
      // be wrong.
      if (puzzle.aiSummary) {
        const aiBlurb = document.createElement('div');
        aiBlurb.className = 'triviaAiBlurb';

        const aiText = document.createElement('div');
        aiText.textContent = puzzle.aiSummary;
        aiBlurb.appendChild(aiText);

        const aiDisclaimer = document.createElement('div');
        aiDisclaimer.className = 'triviaAiDisclaimer';
        aiDisclaimer.textContent = t('triviaAiDisclaimer');
        aiBlurb.appendChild(aiDisclaimer);

        panel.appendChild(aiBlurb);
      }

      panel.appendChild(loading);

      function renderTriviaDetails(trivia) {
        loading.remove();

        if (trivia.wikidataUrl && puzzle.artist) {
          artist.textContent = '';
          const link = document.createElement('a');
          link.href = trivia.wikidataUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = puzzle.artist;
          artist.appendChild(link);
        }

        const grid = document.createElement('dl');
        grid.className = 'triviaGrid';
        const rows = [
          [t('triviaYear'), trivia.year],
          [t('triviaPeriod'), trivia.period],
          [t('triviaStyle'), trivia.style],
          [t('triviaMedium'), trivia.medium],
        ];
        for (const [label, value] of rows) {
          if (!value) continue;
          const dt = document.createElement('dt');
          dt.textContent = label;
          const dd = document.createElement('dd');
          dd.textContent = value;
          grid.appendChild(dt);
          grid.appendChild(dd);
        }
        panel.appendChild(grid);

        if (trivia.funFact) {
          const fact = document.createElement('div');
          fact.className = 'triviaFact';
          fact.textContent = trivia.funFact;
          panel.appendChild(fact);
        }
      }

      svgWrap.appendChild(panel);

      requestAnimationFrame(() => panel.classList.add('show'));

      fetchPaintingTrivia(puzzle.smkObjectNumber, puzzle.title, puzzle.artist).then((trivia) => {
        renderTriviaDetails(trivia);
      }).catch((err) => {
        console.error(err);
        loading.textContent = t('triviaError');
      });
    }

    // The finished puzzle moves off the easel and onto the museum wall: the
    // working canvas (.canvas/.svgWrap) swaps from the easel photo to the
    // same wallpaper background as the home menu (see .canvas.revealed/
    // .svgWrap.revealed), with the painting framed and hung above its
    // plaque instead of still sitting in the pan/zoom canvas.
    function revealOriginalInWrap(svgWrap, referenceImageUrl, puzzle) {
      const canvasEl = document.querySelector('.canvas');
      if (canvasEl) canvasEl.classList.add('revealed');
      svgWrap.classList.add('revealed');

      const topbarEl = document.querySelector('.topbar');
      if (topbarEl) topbarEl.style.display = 'none';

      const img = document.createElement('img');
      img.className = 'finalImage museumFrame museumFrame1';
      img.alt = t('finalImageAlt');
      img.src = referenceImageUrl;

      svgWrap.innerHTML = '';
      svgWrap.appendChild(img);

      const show = () => {
        // Ensure we have at least one frame with opacity:0 before showing
        requestAnimationFrame(() => {
          img.classList.add('show');
        });
      };
      if (img.complete) show();
      else img.addEventListener('load', show, { once: true });

      // Hide the palette and zoom controls when complete.
      const paletteEl = document.querySelector('.palette');
      if (paletteEl) paletteEl.style.display = 'none';
      const zoomControlsEl = document.getElementById('zoomControls');
      if (zoomControlsEl) zoomControlsEl.style.display = 'none';

      renderTriviaPanel(svgWrap, puzzle);
    }

    // `puzzle` is resolved by boot() before calling in — either today's active
    // puzzle or a specific past week the user picked from the menu.
    async function main(puzzle) {
      const loading = document.getElementById('loading');
      const svgWrap = document.getElementById('svgWrap');

      loading.textContent = t('loadingPuzzle');
      // Deliberately not shown until completion (see the trivia panel) —
      // the painting's title/artist would spoil the surprise of seeing what
      // you've been painting.

      const palette = puzzle.palette;
      const counterByNum = buildSwatches(palette);
      wireSwatchScrollHints(document.getElementById('swatches'));
      const paletteSelection = wirePaletteSelection();
      const cheatBtn = document.getElementById('cheatBtn');
      let cheatFn = null;

      function wireCheat() {
        if (!cheatBtn) return;
        const run = () => {
          if (typeof cheatFn === 'function') cheatFn();
        };
        cheatBtn.addEventListener('click', run);
        cheatBtn.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          e.preventDefault();
          run();
        });
      }
      wireCheat();

      // Zoom controls (+/-/reset) — wired once; they call into whichever
      // panzoom controller is currently active for the loaded puzzle.
      let panzoomCtl = null;
      function wireZoomControls() {
        const inBtn = document.getElementById('zoomInBtn');
        const outBtn = document.getElementById('zoomOutBtn');
        const resetBtn = document.getElementById('zoomResetBtn');
        const bind = (el, fn) => {
          if (!el) return;
          el.addEventListener('click', fn);
          el.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            e.preventDefault();
            fn();
          });
        };
        bind(inBtn, () => panzoomCtl && panzoomCtl.stepScale(1.6));
        bind(outBtn, () => panzoomCtl && panzoomCtl.stepScale(1 / 1.6));
        bind(resetBtn, () => panzoomCtl && panzoomCtl.reset());
      }
      wireZoomControls();

      // Show the pinch-to-zoom hint once per browser, on first load only.
      function maybeShowZoomHint() {
        let seen = false;
        try { seen = localStorage.getItem('pnb_zoom_hint_seen') === '1'; } catch (_e) { /* ignore */ }
        if (seen) return;
        const el = document.getElementById('zoomHint');
        if (!el) return;
        requestAnimationFrame(() => el.classList.add('show'));
        setTimeout(() => {
          el.classList.remove('show');
          try { localStorage.setItem('pnb_zoom_hint_seen', '1'); } catch (_e) { /* ignore */ }
        }, 3500);
      }
      maybeShowZoomHint();

      // Hints: highlight and zoom to an unpainted region of the selected
      // color. Limited per puzzle so it stays a nudge, not an autosolve.
      const HINT_LIMIT = 3;
      let hintsRemaining = HINT_LIMIT;
      let hintTargets = { annotated: null };
      // The region a hint last pointed to and hasn't been painted yet — re-hinting
      // the same still-unpainted region (e.g. tapping the button repeatedly before
      // actually painting it) re-shows it for free instead of burning another hint.
      let lastHintedRegion = null;
      const hintBtn = document.getElementById('hintBtn');

      function updateHintBtnLabel() {
        if (!hintBtn) return;
        hintBtn.removeAttribute('disabled');
        const badgeEl = document.getElementById('hintBtnBadge');
        const labelEl = document.getElementById('hintBtnLabel');
        if (hintsRemaining > 0) {
          labelEl.textContent = t('hintButtonStatic');
          badgeEl.textContent = String(hintsRemaining);
          hintBtn.classList.remove('hintBtnWatchAd');
        } else {
          // Instead of just disabling, offer a rewarded ad for more hints (see useHint).
          labelEl.textContent = t('hintButtonWatchAd');
          hintBtn.classList.add('hintBtnWatchAd');
        }
      }

      function pathLocalCenter(svg, path) {
        const vb = svg.viewBox.baseVal;
        const bbox = path.getBBox();
        const cx = bbox.x + bbox.width / 2;
        const cy = bbox.y + bbox.height / 2;
        const scaleFactor = Math.min(svg.clientWidth / vb.width, svg.clientHeight / vb.height);
        const offsetX = (svg.clientWidth - vb.width * scaleFactor) / 2;
        const offsetY = (svg.clientHeight - vb.height * scaleFactor) / 2;
        return {
          lx: offsetX + (cx - vb.x) * scaleFactor,
          ly: offsetY + (cy - vb.y) * scaleFactor,
        };
      }

      function useHint() {
        if (!panzoomCtl || !hintTargets.annotated) return;
        if (hintsRemaining <= 0) {
          hintBtn.setAttribute('disabled', 'true'); // prevent double-taps while the ad loads
          PnbAdMob.showRewardedForHints(
            () => {
              hintsRemaining += (window.PNB_CONFIG && window.PNB_CONFIG.ADMOB_HINT_REWARD_COUNT) || 0;
              updateHintBtnLabel();
            },
            () => { updateHintBtnLabel(); }
          );
          return;
        }
        const selectedNum = paletteSelection.getSelectedNum();
        if (selectedNum == null) {
          const label = document.getElementById('selectedLabel');
          if (label) {
            const prev = label.textContent;
            label.textContent = t('pickColorFirst');
            setTimeout(() => { label.textContent = prev; }, 1400);
          }
          return;
        }
        const candidate = hintTargets.annotated.querySelector(
          `path[data-color-num="${selectedNum}"][data-painted="0"]`
        );
        if (!candidate) return;

        if (candidate !== lastHintedRegion) {
          hintsRemaining -= 1;
          updateHintBtnLabel();
          lastHintedRegion = candidate;
        }

        const { lx, ly } = pathLocalCenter(hintTargets.annotated, candidate);
        panzoomCtl.focusOnLocalPoint(lx, ly, Math.min(4, MAX_ZOOM));
        candidate.classList.remove('pnb-hint');
        void candidate.offsetWidth;
        candidate.classList.add('pnb-hint');
        setTimeout(() => candidate.classList.remove('pnb-hint'), 2200);
      }

      if (hintBtn) {
        hintBtn.addEventListener('click', useHint);
        hintBtn.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          e.preventDefault();
          useHint();
        });
      }

      async function loadAndShow(svgUrl, referenceImageUrl) {
        // Reopening an already-finished puzzle: skip loading/painting the
        // interactive SVG entirely and go straight to the reveal. Doing the
        // full load first and only then discovering it's complete (the old
        // flow) briefly inserted the raw, all-white puzzle SVG into the DOM
        // before immediately tearing it out again — that's what flashed.
        if (getPuzzleProgress(puzzle.puzzleId).completed) {
          revealOriginalInWrap(svgWrap, referenceImageUrl, puzzle);
          return;
        }

        svgWrap.innerHTML = '';
        const fitWarningEl = document.getElementById('fitWarning');
        if (fitWarningEl) fitWarningEl.classList.remove('show');
        // A same-shaped white canvas placeholder (see .paintingLoader) instead
        // of a small text message — so the canvas reads as already being
        // there from the first frame, with a faint sketching animation
        // standing in for the drawing rather than a blank wait, instead of
        // that whole box popping in abruptly once the real SVG is ready.
        const loader = document.createElement('div');
        loader.className = 'paintingLoader';
        svgWrap.appendChild(loader);

        // Ensure palette is visible when starting/restarting a painting.
        const paletteEl = document.querySelector('.palette');
        if (paletteEl) paletteEl.style.display = '';

        const svg = await loadSvg(svgUrl);
        pnbMark('pnb:svg-loaded');
        const annotated = annotateSvg(svg, palette);
        pnbMark('pnb:svg-annotated');
        // Crossfade the real canvas in over the placeholder rather than
        // swapping straight from one to the other.
        svgWrap.appendChild(annotated);
        requestAnimationFrame(() => {
          annotated.classList.add('show');
          loader.classList.add('fadeOut');
          setTimeout(() => loader.remove(), 400);
        });

        hintTargets.annotated = annotated;
        hintsRemaining = HINT_LIMIT;
        lastHintedRegion = null;
        updateHintBtnLabel();

        // Completion tracking: count paintable regions once per load.
        const paintable = Array.from(annotated.querySelectorAll('path')).filter(p => p.dataset.colorNum && p.dataset.colorNum !== '-1');
        const totalToPaint = paintable.length;
        let paintedCount = 0;

        const progressFillEl = document.getElementById('topbarProgressFill');
        function updateProgressBar() {
          if (!progressFillEl) return;
          const pct = totalToPaint > 0 ? (paintedCount / totalToPaint) * 100 : 0;
          progressFillEl.style.width = `${pct}%`;
        }
        updateProgressBar();

        // Per-color tracking for the palette UI.
        const totalByNum = new Map();
        const paintedByNum = new Map();
        paintable.forEach((p, i) => {
          p.dataset.pnbIndex = String(i);
          const n = Number(p.dataset.colorNum);
          totalByNum.set(n, (totalByNum.get(n) || 0) + 1);
        });
        currentPaintable = paintable;
        for (const c of palette) {
          paintedByNum.set(c.num, 0);
          // Reset swatches (they may have been marked done on a prior puzzle)
          const sw = document.querySelector(`.swatch[data-num="${c.num}"]`);
          if (sw) sw.classList.remove('done');
          setSwatchCount(counterByNum, c.num, 0, totalByNum.get(c.num) || 0);
        }

        // getPuzzleProgress(...).completed is always false at this point —
        // the completed case is handled above, before loadAndShow does any
        // of this work — so every completion reached here happens live,
        // during this session, and always gets the interstitial treatment.
        function onCorrectPaint(_path) {
          paintedCount += 1;
          const n = Number(_path.dataset.colorNum);
          const next = (paintedByNum.get(n) || 0) + 1;
          paintedByNum.set(n, next);
          setSwatchCount(counterByNum, n, next, totalByNum.get(n) || 0);
          updateNumberVisibility(_path);
          updateProgressBar();
          markPathPainted(puzzle.puzzleId, Number(_path.dataset.pnbIndex));
          if (totalToPaint > 0 && paintedCount >= totalToPaint) {
            markPuzzleCompleted(puzzle.puzzleId);
            // Let the completion feel (final swatch fill animation) land before
            // any ad interrupts it; PnbAdMob no-ops/calls back instantly in
            // plain-browser dev or if no ad is available.
            setTimeout(() => {
              PnbAdMob.showInterstitial(() => {
                revealOriginalInWrap(svgWrap, referenceImageUrl, puzzle);
              });
            }, 900);
          }
        }

        // Restore any previously painted regions for this puzzle (e.g. the
        // user left for the menu and came back mid-puzzle).
        const savedProgress = getPuzzleProgress(puzzle.puzzleId);
        for (const index of savedProgress.painted) {
          const p = paintable[index];
          if (!p || p.dataset.painted === '1') continue;
          const fill = p.dataset.correctFill;
          if (fill) p.style.fill = fill;
          p.dataset.painted = '1';
          onCorrectPaint(p);
        }

        // Cheat: paint every unpainted region except one, always leaving at
        // least one region for the user to paint themselves — so cheating
        // never finishes the puzzle outright, no matter how many times it's
        // pressed.
        cheatFn = () => {
          const unpainted = paintable.filter((p) => p.dataset.painted !== '1');
          unpainted.pop();
          for (const p of unpainted) {
            const fill = p.dataset.correctFill;
            if (fill) p.style.fill = fill;
            p.dataset.painted = '1';
            onCorrectPaint(p);
          }
        };

        // After insertion, refine viewBox to the real drawing bounds.
        requestAnimationFrame(() => {
          fitSvgToWrap(annotated);
          // Some browsers need a second frame if fonts/paths settle late.
          requestAnimationFrame(() => {
            fitSvgToWrap(annotated);
            // Now wire pan/zoom + tap-to-paint on the fitted SVG
            panzoomCtl = wireCanvasInteractions(annotated, svgWrap, paletteSelection, onCorrectPaint);
            checkFitsWithinWrap(annotated, svgWrap);
            pnbMark('pnb:interactive');
            reportPerf();
          });
        });
        window.addEventListener('resize', () => checkFitsWithinWrap(annotated, svgWrap));
      }

      await loadAndShow(puzzle.svgUrl, puzzle.referenceImageUrl);
    }

    // Navigation is reload-based: main()'s setup (buildSwatches, wireZoomControls,
    // etc.) assumes it runs exactly once per page life, so switching puzzles goes
    // through a fresh `boot()` rather than trying to safely re-run that setup in-page.
    function parsePuzzleHash(hash) {
      const m = /^#puzzle=(.+)$/.exec(hash || '');
      return m ? decodeURIComponent(m[1]) : null;
    }

    // Fades the splash overlay back to fully visible before a navigation
    // reload, mirroring how boot() fades it back OUT once the destination
    // page is ready. Without this, the outgoing screen cuts instantly to
    // location.reload()'s blank flash; with it, that flash happens entirely
    // behind an already-opaque green overlay — the reload is invisible, and
    // the fresh document's own splashOverlay (opaque by default until this
    // page's earlier hideWebSplash() call, which doesn't carry across the
    // reload) picks up exactly where this one left off.
    function showSplashForNavigation() {
      const el = document.getElementById('splashOverlay');
      if (!el) return Promise.resolve();
      if (splashHideTimeoutId !== null) {
        clearTimeout(splashHideTimeoutId);
        splashHideTimeoutId = null;
      }
      el.style.display = '';
      el.classList.remove('hide');
      // Plain color wipe, not the full branded moment — see the .quickNav
      // CSS comment. The destination page adds this same class at the top
      // of boot() (for every non-first boot) so the incoming side matches;
      // it can't be inherited across the reload since that's a fresh
      // document.
      el.classList.add('quickNav');
      return new Promise((resolve) => setTimeout(resolve, 220));
    }

    async function goToPuzzle(idOrToday) {
      await showSplashForNavigation();
      location.hash = `puzzle=${encodeURIComponent(idOrToday)}`;
      location.reload();
    }

    async function backToMenu() {
      await showSplashForNavigation();
      location.hash = '';
      location.reload();
    }

    function menuStatusLabel(progress) {
      if (progress.completed) return t('menuStatusCompleted');
      if (progress.painted.length > 0) return t('menuStatusInProgress');
      return t('menuStatusNotStarted');
    }

    // Unpainted puzzles show a plain primed-canvas placeholder rather than a
    // rendered preview of the actual SVG artwork — fetching/rasterizing
    // every history item's puzzle SVG just for a home-screen thumbnail
    // isn't worth the extra load work, and it keeps the reveal a surprise.
    function setMenuThumb(thumbEl, referenceImageUrl, completed) {
      thumbEl.classList.add('museumFrame');
      thumbEl.classList.remove('skeleton');
      if (completed) {
        thumbEl.textContent = '';
        thumbEl.classList.remove('menuThumbBlank');
        thumbEl.style.backgroundImage = `url("${referenceImageUrl}")`;
        thumbEl.style.backgroundSize = 'contain';
        thumbEl.style.backgroundRepeat = 'no-repeat';
        thumbEl.style.backgroundPosition = 'center';
        // Size the frame itself to the painting's real proportions instead
        // of a fixed square/box — a plain preload just to read
        // naturalWidth/naturalHeight (the visible background-image above
        // is already what actually paints). Keeps the CSS-declared
        // width/height as a fallback until this resolves.
        const probe = new Image();
        probe.onload = () => {
          if (probe.naturalWidth > 0 && probe.naturalHeight > 0) {
            thumbEl.style.aspectRatio = `${probe.naturalWidth} / ${probe.naturalHeight}`;
            thumbEl.style.height = 'auto';
          }
        };
        probe.src = referenceImageUrl;
      } else {
        thumbEl.textContent = '✏️';
        thumbEl.classList.add('menuThumbBlank');
        thumbEl.style.backgroundImage = 'none';
        thumbEl.style.aspectRatio = '';
        thumbEl.style.height = '';
      }
    }

    // A ghost stand-in for buildHistoryCard's output — same classes/
    // structure (so it's sized and framed identically to the real card,
    // museumFrame border included) with shimmering placeholders instead of
    // real content. Shown immediately, before the network round trip that
    // buildHistoryCard's data depends on even starts, so the strip/grid
    // never collapses to empty and then jumps open once data arrives.
    function buildSkeletonHistoryCard() {
      const item = document.createElement('div');
      item.className = 'menuHistoryItem';

      const thumb = document.createElement('div');
      thumb.className = 'menuThumb museumFrame skeleton';
      item.appendChild(thumb);

      const plaque = document.createElement('div');
      plaque.className = 'menuPlaque';
      const number = document.createElement('div');
      number.className = 'menuHistoryNumber skeletonText skeleton';
      number.style.width = '2.4em';
      const status = document.createElement('div');
      status.className = 'menuStatus skeletonText skeleton';
      status.style.width = '4.2em';
      plaque.appendChild(number);
      plaque.appendChild(status);
      item.appendChild(plaque);

      return item;
    }

    function renderSkeletonHistoryCards(container, count) {
      container.innerHTML = '';
      for (let i = 0; i < count; i++) {
        container.appendChild(buildSkeletonHistoryCard());
      }
    }

    // Shared by the menu's horizontal strip and the archive grid — a button
    // card for one past puzzle. Labeled by its release order ("#N"), not its
    // date — see fetchNumberedPuzzleHistory.
    function buildHistoryCard(row) {
      const progress = getPuzzleProgress(row.puzzleId);
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'menuHistoryItem';

      const thumb = document.createElement('div');
      thumb.className = 'menuThumb';
      setMenuThumb(thumb, row.referenceImageUrl, progress.completed);

      const plaque = document.createElement('div');
      plaque.className = 'menuPlaque';
      const number = document.createElement('div');
      number.className = 'menuHistoryNumber';
      number.textContent = t('menuPuzzleNumber', { num: row.number });
      const status = document.createElement('div');
      status.className = 'menuStatus';
      status.textContent = menuStatusLabel(progress);
      plaque.appendChild(number);
      plaque.appendChild(status);

      item.appendChild(thumb);
      item.appendChild(plaque);
      item.addEventListener('click', () => goToPuzzle(row.puzzleId));
      return item;
    }

    async function renderMenu() {
      document.getElementById('menuOverlay').classList.add('show');
      showBannerIfReady();

      const todayThumbEl0 = document.getElementById('menuTodayThumb');
      const todayStatusEl = document.getElementById('menuTodayStatus');
      const historyStripEl0 = document.getElementById('menuHistoryStrip');
      // Ghost state while both fetches are in flight — see
      // buildSkeletonHistoryCard's comment for why this (not the shimmer
      // itself) is what actually stops the menu from jumping open.
      todayThumbEl0.textContent = '';
      todayThumbEl0.classList.add('skeleton');
      todayStatusEl.textContent = '';
      todayStatusEl.classList.add('skeletonText', 'skeleton');
      todayStatusEl.style.width = '5em';
      renderSkeletonHistoryCards(historyStripEl0, 6);

      const [todayResult, historyResult] = await Promise.allSettled([fetchActivePuzzle(), fetchRecentPuzzleHistory()]);

      const todayCard = document.getElementById('menuTodayCard');
      const todayThumb = document.getElementById('menuTodayThumb');
      const todayStatus = document.getElementById('menuTodayStatus');
      todayStatus.classList.remove('skeletonText', 'skeleton');
      todayStatus.style.width = '';
      if (todayResult.status === 'fulfilled') {
        const progress = getPuzzleProgress(todayResult.value.puzzleId);
        todayStatus.textContent = menuStatusLabel(progress);
        setMenuThumb(todayThumb, todayResult.value.referenceImageUrl, progress.completed);
        todayCard.addEventListener('click', () => goToPuzzle('today'));
      } else {
        console.error(todayResult.reason);
        todayThumb.classList.remove('skeleton');
        todayThumb.textContent = '⚠️';
        todayStatus.textContent = t('errorNoActivePuzzle');
        todayCard.disabled = true;
      }

      const historyStripEl = document.getElementById('menuHistoryStrip');
      historyStripEl.innerHTML = '';
      const historyRows = historyResult.status === 'fulfilled' ? historyResult.value : [];
      if (historyResult.status === 'rejected') console.error(historyResult.reason);
      if (!historyRows.length) {
        const empty = document.createElement('div');
        empty.className = 'menuHistoryEmpty';
        empty.textContent = t('menuHistoryEmpty');
        historyStripEl.appendChild(empty);
      } else {
        for (const row of historyRows) {
          historyStripEl.appendChild(buildHistoryCard(row));
        }
      }

      wireArchive();
    }

    // Gate on the animated first-boot splash (see boot()): a native banner ad
    // is a separate OS-level view, not part of the DOM/CSS stacking context,
    // so it would otherwise visibly appear on top of the splash instead of
    // waiting for it to finish. False only during that initial animated
    // window; boot() flips it true (and shows any banner this screen wanted)
    // the instant the splash actually hides.
    let adsReady = true;

    function showBannerIfReady() {
      if (adsReady) PnbAdMob.showBanner();
    }

    // Archive state: fetched once, lazily, on first open — a flat, numbered
    // list (no date-based grouping), so opening it again just re-renders the
    // already-fetched array with no repeat network round trip.
    let archiveRows = null;

    function renderArchiveGrid() {
      const grid = document.getElementById('archiveGrid');
      grid.innerHTML = '';

      if (!archiveRows.length) {
        const empty = document.createElement('div');
        empty.className = 'archiveEmpty';
        empty.textContent = t('archiveEmpty');
        grid.appendChild(empty);
        return;
      }

      for (const row of archiveRows) {
        grid.appendChild(buildHistoryCard(row));
      }
    }

    async function openArchive() {
      document.getElementById('archiveOverlay').classList.add('show');
      showBannerIfReady();
      if (!archiveRows) {
        const grid = document.getElementById('archiveGrid');
        renderSkeletonHistoryCards(grid, 12);
        archiveRows = await fetchPuzzleArchive();
      }
      renderArchiveGrid();
    }

    function closeArchive() {
      document.getElementById('archiveOverlay').classList.remove('show');
    }

    function wireArchive() {
      const openBtn = document.getElementById('menuArchiveBtn');
      openBtn.addEventListener('click', openArchive);
      document.getElementById('archiveCloseBtn').addEventListener('click', closeArchive);
    }

    function wireHomeButton() {
      const btn = document.getElementById('homeBtn');
      btn.classList.add('show');
      const topbar = document.querySelector('.topbar');
      if (topbar) topbar.classList.add('hasBack');
      btn.addEventListener('click', backToMenu);
      btn.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        backToMenu();
      });
    }

    function wireNumbersToggle() {
      const btn = document.getElementById('numbersToggleBtn');
      btn.classList.add('show');
      const topbar = document.querySelector('.topbar');
      if (topbar) topbar.classList.add('hasNumbersToggle');

      const applyState = () => {
        btn.classList.toggle('active', hideNumbersEnabled);
        btn.setAttribute('aria-pressed', String(hideNumbersEnabled));
      };
      applyState();

      const activate = () => {
        hideNumbersEnabled = !hideNumbersEnabled;
        saveHideNumbersPref(hideNumbersEnabled);
        applyState();
        refreshAllNumberVisibility();
      };
      btn.addEventListener('click', activate);
      btn.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        activate();
      });
    }

    function wireProgressToggle() {
      const btn = document.getElementById('progressToggleBtn');
      const bar = document.getElementById('topbarProgress');
      btn.classList.add('show');
      const topbar = document.querySelector('.topbar');
      if (topbar) topbar.classList.add('hasProgressToggle');

      const applyState = () => {
        btn.classList.toggle('active', showProgressEnabled);
        btn.setAttribute('aria-pressed', String(showProgressEnabled));
        if (bar) bar.classList.toggle('show', showProgressEnabled);
      };
      applyState();

      const activate = () => {
        showProgressEnabled = !showProgressEnabled;
        saveShowProgressPref(showProgressEnabled);
        applyState();
      };
      btn.addEventListener('click', activate);
      btn.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        activate();
      });
    }

    // On native (iOS/Android), Capacitor shows a static launch splash from native
    // code before any web content loads. `#splashOverlay` is plain HTML/CSS (no JS
    // needed to paint it, and it keeps animating via CSS alone), so the instant the
    // web view can render anything, it already matches — hide the native splash
    // right away rather than waiting on the network, closing the gap that used to
    // flash black/blank between native splash and app content.
    function hideNativeSplash() {
      const splashScreen = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen;
      if (splashScreen) splashScreen.hide();
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    // Matches the .splashSwatch CSS: the last swatch starts its 2.4s color-cycle
    // after a 0.6s stagger delay, so 3000ms is when every swatch has completed
    // one full cycle. Keep this in sync if those CSS values change.
    const SPLASH_ANIMATION_MS = 3000;

    // Tracked so showSplashForNavigation can cancel it — otherwise a
    // navigation started right after this page's own splash finished
    // hiding could race this pending display:none against the fade back
    // in it needs to show for the upcoming reload.
    let splashHideTimeoutId = null;

    function hideWebSplash() {
      const el = document.getElementById('splashOverlay');
      if (!el) return;
      el.classList.add('hide');
      splashHideTimeoutId = setTimeout(() => { el.style.display = 'none'; }, 220);
    }

    // Lightweight, opt-in perf instrumentation (see PERFORMANCE.md). Marks
    // are cheap no-ops unless ?perf=1 is in the URL, so they're safe to leave
    // in place permanently rather than stripping them for production.
    function pnbMark(name) {
      try { performance.mark(name); } catch (_e) { /* perf API unavailable */ }
    }

    function pnbPerfEnabled() {
      try { return new URLSearchParams(location.search).get('perf') === '1'; }
      catch (_e) { return false; }
    }

    function reportPerf() {
      if (!pnbPerfEnabled()) return;
      try {
        const at = (name) => {
          const entries = performance.getEntriesByName(name);
          return entries.length ? entries[entries.length - 1].startTime : null;
        };
        const bootStart = at('pnb:boot-start');
        const i18nDone = at('pnb:i18n-loaded');
        const puzzleFetched = at('pnb:puzzle-fetched');
        const svgLoaded = at('pnb:svg-loaded');
        const svgAnnotated = at('pnb:svg-annotated');
        const interactive = at('pnb:interactive');
        if (bootStart == null || interactive == null) return;

        const ms = (a, b) => (a != null && b != null) ? Math.round(b - a) : '';
        const row = {
          time_to_interactive_ms: Math.round(interactive - bootStart),
          i18n_ms: ms(bootStart, i18nDone),
          puzzle_fetch_ms: ms(i18nDone, puzzleFetched),
          svg_load_ms: ms(puzzleFetched, svgLoaded),
          svg_annotate_ms: ms(svgLoaded, svgAnnotated),
        };

        const date = new Date().toISOString().slice(0, 10);
        const csvRow = `${date},DEVICE,BROWSER,NOTES,${row.time_to_interactive_ms},${row.i18n_ms},${row.puzzle_fetch_ms},${row.svg_load_ms},${row.svg_annotate_ms}`;
        console.log('[pnb-perf] fill in DEVICE/BROWSER/NOTES and append to perf/BENCHMARKS.csv:');
        console.log(csvRow);

        const el = document.createElement('div');
        el.style.cssText = 'position:fixed;bottom:8px;left:8px;z-index:99999;background:rgba(0,0,0,0.85);color:#fff;font:12px/1.5 monospace;padding:10px 12px;border-radius:8px;max-width:90vw;white-space:pre;';
        el.textContent = `pnb-perf (ms)\ntime-to-interactive: ${row.time_to_interactive_ms}\ni18n load: ${row.i18n_ms}\npuzzle fetch: ${row.puzzle_fetch_ms}\nsvg load: ${row.svg_load_ms}\nsvg annotate: ${row.svg_annotate_ms}\n(full CSV row logged to console)`;
        const closeBtn = document.createElement('div');
        closeBtn.textContent = '× close';
        closeBtn.style.cssText = 'margin-top:6px;text-align:right;opacity:0.7;cursor:pointer;';
        closeBtn.addEventListener('click', () => el.remove());
        el.appendChild(closeBtn);
        document.body.appendChild(el);
      } catch (_e) { /* perf reporting must never break the app */ }
    }

    async function boot() {
      pnbMark('pnb:boot-start');
      hideNativeSplash();
      wireViewportSizeSync();
      PnbAdMob.init();

      // The splash now stays up and masks EVERY boot, not just the first —
      // this app navigates menu<->puzzle via a real location.reload() (see
      // goToPuzzle/backToMenu), which flashes blank/default-styled markup
      // between unload and this script re-running. Hiding the splash the
      // instant it's ready to (rather than jump-cutting straight to
      // whatever's rendered so far) is what actually smooths that over.
      // Only the FIRST boot per session pads out to the full brand-moment
      // animation length below — later navigations hide it the instant
      // content is ready, so the app still feels immediate rather than
      // replaying the animation every time. sessionStorage survives
      // reloads (same WebView instance) but resets on a real app relaunch.
      const isFirstBoot = !sessionStorage.getItem('pnb_booted');
      try { sessionStorage.setItem('pnb_booted', '1'); } catch (_e) { /* ignore */ }
      // Plain color wipe (no logo/animation) on every boot after the
      // first — see the .quickNav CSS comment. Applied here too (not just
      // in showSplashForNavigation) since a fresh reload's document never
      // carries classes over from the page that triggered it.
      if (!isFirstBoot) {
        const splashEl = document.getElementById('splashOverlay');
        if (splashEl) splashEl.classList.add('quickNav');
      }
      // Hold off on any ad (a native view, not part of the DOM/CSS
      // stacking, so it wouldn't otherwise wait its turn) until the splash
      // covering it has actually finished hiding, below.
      adsReady = false;

      const bootStarted = Date.now();
      try {
        I18N = await loadTranslations(LANG);
        pnbMark('pnb:i18n-loaded');
        document.documentElement.lang = LANG;
        applyStaticTranslations();
        wireTopbarHeightSync();

        const requested = parsePuzzleHash(location.hash);
        if (requested === null) {
          await renderMenu();
          return;
        }
        wireHomeButton();
        wireNumbersToggle();
        wireProgressToggle();
        showBannerIfReady();
        const puzzle = requested === 'today' ? await fetchActivePuzzle() : await fetchPuzzleById(requested);
        pnbMark('pnb:puzzle-fetched');
        fetchPuzzleNumber(puzzle.puzzleId).then(setPuzzleTitle).catch(() => {});
        await main(puzzle);
      } finally {
        if (isFirstBoot) {
          const remaining = SPLASH_ANIMATION_MS - (Date.now() - bootStarted);
          if (remaining > 0) await sleep(remaining);
        }
        // One more beat behind the mask before revealing anything: a fresh
        // reload can still be mid-reflow right as this resolves (e.g.
        // WKWebView settling its real bounds a frame late — see
        // wireViewportSizeSync's ResizeObserver/double-rAF correction for
        // that specific case) and two rAFs is enough for any such pending
        // layout to finish, so it never becomes visible.
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        hideWebSplash();
        adsReady = true;
        showBannerIfReady();
      }
    }

    wireDebugBanner();
    wireProductionErrorOverlay();

    boot().catch((err) => {
      console.error(err);
      const isFile = window.location.protocol === 'file:';
      if (IS_PRODUCTION) {
        showProductionError(isFile ? 'FILE_PROTOCOL' : (err.code || 'BOOT_FAILED'));
        return;
      }
      showDebugBanner(`boot() failed: ${err.message || err}\n\nSUPABASE_URL: ${SUPABASE_URL}`);
      // #svgWrap only exists on the puzzle route (renderMenu's failures are
      // handled inline instead) — guard rather than assume it's present.
      const svgWrap = document.getElementById('svgWrap');
      if (!svgWrap) return;
      svgWrap.innerHTML = '';
      const msg = document.createElement('div');
      msg.className = 'loading';
      msg.textContent = isFile
        ? t('errorFileProtocol')
        : t('errorGeneric', { message: err.message || err });
      svgWrap.appendChild(msg);
    });
  </script>
</body>
</html>
